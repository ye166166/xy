<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f7df6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>高中AI提分宝</title>
<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --ink:#1a1d26;
  --ink-2:#5b6472;
  --ink-3:#9aa1ad;
  --line:#eceef3;
  --brand:#2f7df6;
  --brand-g:#4aa3ff;
  --green:#10b981;
  --orange:#f59e0b;
  --red:#ef4444;
  --purple:#8b5cf6;
  --radius:16px;
  --shadow:0 2px 12px rgba(20,24,40,.06);
  --tab-h:62px;
}
[data-theme="dark"]{
  --bg:#0f1116;
  --card:#1a1e26;
  --ink:#e8eaf0;
  --ink-2:#a3abb8;
  --ink-3:#6b7382;
  --line:#262c38;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  max-width:680px;margin:0 auto;padding-bottom:calc(var(--tab-h) + 24px);
  -webkit-font-smoothing:antialiased;
}
/* 桌面全屏适配 */
@media (min-width:820px){
  body{max-width:1200px;padding:0 24px calc(var(--tab-h) + 24px)}
  .page{padding:0 24px 20px}
  .tabbar{max-width:1200px}
  .sheet{max-width:1200px}
  .subject-grid{grid-template-columns:repeat(3,1fr);gap:14px}
  .subject-cell{padding:20px 14px}
  .subject-cell .ico{width:56px;height:56px;font-size:28px;border-radius:16px}
  .subject-cell .nm{font-size:16px}
  .subject-cell .st{font-size:12px}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .hero-card{padding:22px 24px}
  .hero-card .greet{font-size:19px}
  .hero-card .quote{font-size:13px}
  .appbar{padding:18px 26px 20px;border-radius:0 0 24px 24px}
  .appbar h1{font-size:22px}
  .q-card{padding:22px}
  .qtext{font-size:18px}
  .video-slide .txt{font-size:20px}
  .chat-wrap{height:calc(100vh - 150px)}
  .card .row{padding:15px 18px}
}
/* 平板两列 */
@media (min-width:640px) and (max-width:819px){
  .subject-grid{grid-template-columns:repeat(3,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
::-webkit-scrollbar{display:none}
.page{display:none;padding:0 14px 20px;animation:fadein .22s ease}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- appbar ---------- */
.appbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--brand),var(--brand-g));
  color:#fff;padding:14px 16px 16px;border-radius:0 0 22px 22px;
  box-shadow:0 4px 18px rgba(47,125,246,.28);
}
.appbar .row{display:flex;align-items:center;justify-content:space-between}
.appbar h1{font-size:19px;font-weight:800;letter-spacing:.5px}
.appbar h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.appbar .sub{font-size:11px;opacity:.85;margin-top:3px}
.appbar .btns{display:flex;gap:8px}
.appbar .btns .btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}
.appbar .btns .btn:active{transform:scale(.96)}

/* ---------- home ---------- */
.hero-card{
  margin:-6px 0 14px;padding:16px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,#2f7df6,#38bdf8);
  box-shadow:0 6px 20px rgba(47,125,246,.3);
  position:relative;overflow:hidden;
}
.hero-card:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-card:before{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-card .greet{font-size:15px;font-weight:700}
.hero-card .quote{font-size:11px;opacity:.9;margin-top:4px}
.hero-card .streak{margin-top:10px;display:flex;gap:8px;align-items:center}
.hero-card .streak b{font-size:22px;font-weight:800}
.hero-card .streak span{font-size:11px;opacity:.9}
.chip-mini{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;font-size:11px;display:inline-flex;gap:4px;align-items:center}

/* ---------- section ---------- */
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}
.sec-title h3{font-size:15px;font-weight:800}
.sec-title .more{font-size:12px;color:var(--ink-3);cursor:pointer}
.sec-title .more:active{opacity:.6}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.subject-cell{
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 10px;text-align:center;cursor:pointer;
  transition:transform .12s;border:none;
}
.subject-cell:active{transform:scale(.96)}
.subject-cell .ico{width:44px;height:44px;border-radius:13px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.subject-cell .nm{font-size:13px;font-weight:700}
.subject-cell .st{font-size:10px;color:var(--ink-3);margin-top:3px}
.sc-math{background:linear-gradient(135deg,#2f7df6,#4aa3ff)}
.sc-eng{background:linear-gradient(135deg,#10b981,#34d399)}
.sc-cn{background:linear-gradient(135deg,#f59e0b,#fbbf24)}

/* ---------- chips/tabs ---------- */
.chips{display:flex;gap:8px;margin:12px 2px;overflow-x:auto}
.chip{flex:none;font-size:13px;font-weight:600;padding:8px 15px;border-radius:99px;background:var(--card);color:var(--ink-2);border:1px solid var(--line);cursor:pointer;transition:.15s}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.subtab{display:flex;gap:6px;margin:12px 0;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.subtab button{flex:1;border:none;background:transparent;color:var(--ink-2);font-size:13px;font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.subtab button.active{background:var(--brand);color:#fff}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--line);transition:.12s}
.row:last-child{border-bottom:none}
.row:active{background:rgba(47,125,246,.05)}
.row .badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.row .body{flex:1;min-width:0}
.row .body .t{font-size:14px;font-weight:700}
.row .body .s{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.row .arrow{color:var(--ink-3);font-size:16px}
.tag{font-size:10px;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px}
.tag.blue{background:#e8f0ff;color:var(--brand)}
.tag.green{background:#e6f9f1;color:var(--green)}
.tag.orange{background:#fff4e0;color:var(--orange)}
.tag.red{background:#ffe9e9;color:var(--red)}
.tag.purple{background:#f0eaff;color:var(--purple)}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;box-shadow:0 4px 14px rgba(47,125,246,.3)}
.btn.primary:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:10px;font-size:13px;border-radius:11px;display:inline-block;width:auto}

/* ---------- quiz ---------- */
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.quiz-progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.quiz-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-g));border-radius:99px;transition:width .3s}
.q-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.q-card .qidx{font-size:11px;color:var(--brand);font-weight:700}
.q-card .qtext{font-size:16px;font-weight:700;line-height:1.6;margin:8px 0 16px}
.opt{
  display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.15s;font-size:14px;
}
.opt:active{transform:scale(.99)}
.opt .key{width:26px;height:26px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink-2);flex:none}
.opt.correct{border-color:var(--green);background:#e6f9f1}
.opt.correct .key{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#ffe9e9}
.opt.wrong .key{background:var(--red);color:#fff}
.opt.disabled{pointer-events:none}
.explain{margin-top:8px;padding:12px;border-radius:12px;background:#f0f6ff;font-size:13px;line-height:1.7;display:none}
[data-theme="dark"] .explain{background:#1b2a44}
.explain.show{display:block}
.explain b{color:var(--brand)}
.inline-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;background:var(--card);color:var(--ink)}
.inline-input:focus{border-color:var(--brand)}
.answer-box{margin-top:14px}

/* ---------- radar ---------- */
.radar-wrap{display:flex;justify-content:center;padding:6px 0 0}
.radar-legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.radar-legend span{font-size:10px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.radar-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar-row .lbl{font-size:12px;font-weight:700;width:84px;flex:none}
.bar-row .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.bar-row .val{font-size:12px;font-weight:800;width:34px;text-align:right}

/* ---------- chat ---------- */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 130px)}
.chat-log{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:86%}
.msg .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.msg .bubble{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start}
.msg.ai .bubble{background:var(--card);box-shadow:var(--shadow);border-radius:4px 14px 14px 14px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;border-radius:14px 4px 14px 14px}
.msg.me .av{background:linear-gradient(135deg,#10b981,#34d399)}
.chat-input{display:flex;gap:8px;padding:10px 0;background:var(--bg)}
.chat-input input{flex:1;border:1.5px solid var(--line);border-radius:99px;padding:11px 16px;font-size:14px;outline:none;background:var(--card);color:var(--ink)}
.chat-input input:focus{border-color:var(--brand)}
.chat-input .send{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;font-size:17px;cursor:pointer;flex:none}
.quick-q{margin:4px 2px 10px;display:flex;gap:8px;overflow-x:auto}
.quick-q span{flex:none;font-size:11px;color:var(--brand);background:var(--card);border:1px solid #dbe7ff;padding:6px 12px;border-radius:99px;cursor:pointer}
[data-theme="dark"] .quick-q span{border-color:#2b3a5c}
.cursor-blink::after{content:"▌";animation:blink 1s infinite}

/* ---------- stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-cell{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:center}
.stat-cell b{font-size:22px;font-weight:800;display:block}
.stat-cell .lab{font-size:11px;color:var(--ink-3);margin-top:4px}

/* ---------- dictation ---------- */
.dict-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
.dict-card .word-ph{font-size:15px;color:var(--brand);font-weight:700;margin-top:8px;letter-spacing:.5px}
.dict-card .word-meaning{font-size:14px;color:var(--ink-2);margin-top:6px}
.dict-card .bigword{font-size:30px;font-weight:800;margin-top:10px;letter-spacing:1px}
.speaker{
  width:58px;height:58px;border-radius:50%;border:none;margin:16px auto 0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(47,125,246,.35);
}
.speaker:active{transform:scale(.94)}
.speaker.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(47,125,246,.15)}}
.dict-flash{min-height:60px;display:flex;align-items:center;justify-content:center}
.dict-flash .verdict{font-size:17px;font-weight:800}
.dict-flash .verdict.ok{color:var(--green)}
.dict-flash .verdict.no{color:var(--red)}

/* ---------- word card flip ---------- */
.word-card{perspective:1000px;height:210px;margin-bottom:14px;cursor:pointer}
.word-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.word-card.flip .word-inner{transform:rotateY(180deg)}
.word-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.word-face.back{transform:rotateY(180deg)}
.word-face .w{font-size:26px;font-weight:800}
.word-face .p{font-size:13px;color:var(--ink-3);margin-top:6px}
.word-face .m{font-size:17px;font-weight:700;margin-top:10px}
.word-face .e{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.6;font-style:italic}
.word-face .hint{position:absolute;bottom:12px;font-size:10px;color:var(--ink-3)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:999;
  background:rgba(20,23,31,.9);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;max-width:80%;text-align:center;
}
#toast.show{opacity:1}
#toast.ok{background:rgba(16,185,129,.95)}
#toast.err{background:rgba(239,68,68,.95)}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;z-index:90;
  background:var(--card);border-top:1px solid var(--line);height:var(--tab-h);
  display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 16px rgba(20,24,40,.05);
}
.tabbar .tab{flex:1;background:none;border:none;color:var(--ink-3);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabbar .tab .i{font-size:20px;line-height:1}
.tabbar .tab.active{color:var(--brand);font-weight:700}
.tabbar .tab.active .i{transform:translateY(-1px)}
.tabbar .tab .i-wrap{position:relative}
.tabbar .tab .dot{position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ---------- misc ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,40,.5);z-index:120;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:680px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:14px}
.sheet .close{float:right;font-size:20px;color:var(--ink-3);background:none;border:none;cursor:pointer}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px}
.switch-row:last-child{border-bottom:none}
.switch{position:relative;width:46px;height:26px;background:var(--line);border-radius:99px;cursor:pointer;transition:.2s;border:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{left:23px}
.kv{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:700}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.8}
.empty .big{font-size:38px;margin-bottom:10px}
.poem-line{margin-bottom:10px}
.poem-line .pl{font-size:16px;line-height:1.9;letter-spacing:1px}
.poem-line .blank{display:inline-block;border-bottom:2px solid var(--brand);min-width:60px;text-align:center;color:var(--brand);font-weight:800;cursor:pointer}
.poem-line .blank.done{border-bottom-color:var(--green);color:var(--green)}
.score-ring{width:92px;height:92px;margin:0 auto}
.tip-box{margin-top:12px;padding:12px;border-radius:12px;background:#fff4e0;font-size:12px;line-height:1.7;color:#8a6a1d}
[data-theme="dark"] .tip-box{background:#3a2f14;color:#e8c877}
.pill-ok{display:inline-block;background:#e6f9f1;color:var(--green);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill-warn{display:inline-block;background:#fff4e0;color:var(--orange);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}

/* ---------- 知识点视频讲解 ---------- */
.kp-tabs{display:flex;gap:6px;margin:12px 0;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.kp-tabs button{flex:1;border:none;background:transparent;color:var(--ink-2);font-size:13px;font-weight:700;padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
.kp-tabs button.active{background:var(--brand);color:#fff}
.video-stage{
  background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:16px;padding:18px 16px 14px;
  position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,.4);
}
[data-theme="light"] .video-stage{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.video-stage .vbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.video-stage .vbar .rec{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:blink 1.2s infinite}
.video-stage .vbar .label{font-size:11px;opacity:.85;letter-spacing:1px}
.video-stage .vbar .steps{margin-left:auto;font-size:11px;opacity:.75}
.video-slide{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center}
.video-slide .txt{font-size:17px;font-weight:700;line-height:1.8;word-break:break-word}
.video-controls{display:flex;gap:8px;margin-top:12px}
.video-controls .vc{flex:1;border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
.vc.play{background:#fff;color:#1e3a8a}
.vc.prev,.vc.next{background:rgba(255,255,255,.16);color:#fff}
.vc.next:disabled,.vc.prev:disabled{opacity:.4;pointer-events:none}
.vc.speak{background:rgba(255,255,255,.16);color:#fff}
.mastery{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.mastery .ring{width:46px;height:46px;flex:none}
.mastery .info{font-size:12px;color:var(--ink-2);line-height:1.5}
.mastery .info b{font-size:15px;color:var(--brand);display:block}

/* ---------- TTS ---------- */
const tts = {
  active:false, current:null,
  init(){this.active=!!(window.speechSynthesis&&window.speechSynthesis.getVoices().length)||!(typeof window.speechSynthesis==="undefined");},
  pickVoice(lang){
    const vs = speechSynthesis.getVoices();
    const pre = S.voice.name && vs.find(v=>v.name===S.voice.name);
    if(pre) return pre;
    // macOS 系统发音人优先（Apple 内置音色更自然）
    if(lang==="en"){
      const macEn = vs.find(v=>/Ting-Ting|Meijia|Samantha|Daniel|Alex|Siri|Eddy|Karen|Moira/i.test(v.name));
      const en = vs.find(v=>/^en/i.test(v.lang)||/English/i.test(v.name));
      return macEn||en||vs[0];
    }
    const macZh = vs.find(v=>/婷婷|Ting-Ting|Siri|Meijia|Li-ming|普通话|简体/i.test(v.name));
    const zh = vs.find(v=>/^zh/i.test(v.lang)||/中文|Chinese/i.test(v.name));
    return macZh||zh||vs[0];
  },
  speak(text,lang="zh",opt={}){
    if(!("speechSynthesis" in window)){toast("当前浏览器不支持语音播报","err");return}
    try{speechSynthesis.cancel()}catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==="en"?"en-US":"zh-CN";
    const v=this.pickVoice(lang);
    if(v)u.voice=v;
    u.rate=opt.rate??S.voice.rate;
    u.pitch=opt.pitch??S.voice.pitch;
    speechSynthesis.speak(u);
    return u;
  },
  stop(){if("speechSynthesis" in window)speechSynthesis.cancel();},
  supported(){return "speechSynthesis" in window}
};

function startTest(){
  TEST_FLOW.subject="math";TEST_FLOW.idx=0;TEST_FLOW.answers=[];TEST_FLOW.start=Date.now();
  TEST_FLOW.cur={math:0,english:0,chinese:0};
  go("test");
}
function answerTest(i){
  const bank=D.TEST_BANK[TEST_FLOW.subject];
  const q=bank[TEST_FLOW.idx];
  TEST_FLOW.answers[TEST_FLOW.idx]=i;
  const ok=i===q.a;
  S.answerTotal++; if(ok)S.correctTotal++;
  if(ok)TEST_FLOW.cur[TEST_FLOW.subject]++;
  S.save();
  render();
}
function nextTest(){
  const order=["math","english","chinese"];
  const bank=D.TEST_BANK[TEST_FLOW.subject];
  if(TEST_FLOW.idx<bank.length-1){TEST_FLOW.idx++;render();return}
  const ni=order.indexOf(TEST_FLOW.subject)+1;
  if(ni<order.length){TEST_FLOW.subject=order[ni];TEST_FLOW.idx=0;render();return}
  finishTest();
}
function finishTest(){
  const order=["math","english","chinese"];
  const scores={}, wrongs=[];
  order.forEach(sub=>{
    const bank=D.TEST_BANK[sub];
    const ans=TEST_FLOW.cur[sub];
    scores[sub]=Math.round(ans/bank.length*100);
  });
  // 计算每个模块得分（flat）
  const modScore={}, modCnt={};
  let flatIdx=0;
  const allQ=[...D.TEST_BANK.math.map(q=>({...q,sub:"math"})),...D.TEST_BANK.english.map(q=>({...q,sub:"english"})),...D.TEST_BANK.chinese.map(q=>({...q,sub:"chinese"}))];
  allQ.forEach((q,i)=>{
    const a=TEST_FLOW.answers[i];
    modScore[q.m]=(modScore[q.m]||0)+(a===q.a?100:0);
    modCnt[q.m]=(modCnt[q.m]||0)+1;
  });
  const modPct={};
  Object.keys(modScore).forEach(k=>modPct[k]=Math.round(modScore[k]/modCnt[k]));
  // 排名薄弱点
  const recs=[];
  const ENSUB={vocab:"eng",grammar:"eng",reading:"eng"};
  Object.keys(modPct).forEach(k=>{
    const cj=CJ_MATH[k];
    const mi=D.MATH_MODULES.find(m=>m.id===k);
    const en={vocab:["英语","词汇基础"],grammar:["英语","语法运用"],reading:["英语","阅读与理解"],poem:["语文","古诗文默写"],classic:["语文","文言文理解"],lang:["语文","语言文字运用"]}[k];
    const nm = cj?("初中数学 · "+cj.name):(mi?mi.name:(en?en[1]:k));
    const short = cj?("初中·"+cj.name):(mi?("数学·"+k.replace("M","")):(en?en[0]+"·"+k:k));
    const sub = cj?"math":(mi?"math":(ENSUB[k]||"cn"));
    const hsMod = cj?cj.hs:null;
    recs.push({k,name:nm,short,score:modPct[k],sub,priority:mi?mi.star:(sub==="eng"?3:2),hsMod});
  });
  recs.sort((a,b)=>a.score-b.score || b.priority-a.priority);
  const total = Math.round((scores.math+scores.english+scores.chinese)/3);
  S.entranceDone=true;
  S.report={scores,modPct,total,recs,date:todayStr(),wrongs:[]};
  S.save();
  storeStudy();
  go("report");
}
function storeStudy(){
  const day=S.studyDays[todayStr()]||{min:0};
  day.min+=3;
  S.studyDays[todayStr()]=day;
  S.studied=(S.studied||0)+3*60;
  S.save();
}

function renderPath(r){

  return top.map((x,i)=>{
    const target = x.hsMod?` → 对应高中「${esc(modName(x.hsMod))}」模块`:"";
    return `<b>${i+1}. ${esc(x.name)}（当前${x.score}分）${target}</b><br>建议：先夯实基础，每天${15+i*5}分钟专项训练，掌握后再进入高中对应模块学习。<br><br>`;

function answerMath(i){
  const m=D.MATH_MODULES.find(x=>x.id===MQ.mid);
  const q=m.qs[MQ.idx];
  MQ.history[MQ.idx]=i;
  S.answerTotal++; if(i===q.a)S.correctTotal++;
  if(i===q.a)MQ.correct++;
  else addWrong({mid:m.id,kp:"配套练习",q,chosen:i});
  S.save();
  render();
}
function nextMath(){
  const m=D.MATH_MODULES.find(x=>x.id===MQ.mid);
  if(MQ.idx<m.qs.length-1){MQ.idx++;render();return}
  // 完成模块
  if(!S.mathDone.includes(m.id))S.mathDone.push(m.id);
  S.save();
  toast("模块学习完成 🎉","ok");
  const rate=MQ.correct/m.qs.length;
  if(rate>=0.67){
    toast("已掌握，进入下一模块");
    go("learn",{sub:"math"});
  }else{
    go("mdetail",{mid:m.id});
    setTimeout(()=>toast("正确率不足67%，建议重新练习","err"),300);
  }
}
function addWrong(w){
  S.mathWrong=S.mathWrong||[];
  const idx=S.mathWrong.findIndex(x=>x.mid===w.mid&&x.q.t===w.q.t);
  if(idx>=0)S.mathWrong[idx]={...w,count:(S.mathWrong[idx].count||0)+1};
  else S.mathWrong.push({...w,count:1,date:todayStr()});
}
function delWrong(mid,qt){
  S.mathWrong=(S.mathWrong||[]).filter(x=>!(x.mid===mid&&x.q.t===qt));
  S.save();
}

function kpTab(tab){KP.tab=tab;KP.slide=0;KP.qIdx=0;KP.qHist=[];KP.qDone=false;KP.attempts=0;KP.correct=0;KP.redo=false;render();}

function kpSpeak(txt){tts.speak(txt.replace(/&quot;/g,"\""),"zh");}
function kpQuiz(m,kp,mastery){

  const ans=KP.qHist[KP.qIdx];
  const answered=ans!=null;
  const allDone=KP.qIdx>=qs.length-1&&answered;
  return `
  ${!KP.redo?`<div class="quiz-head"><span>${esc(kp.t)}</span><b>${Math.min(KP.qIdx+1,qs.length)}/${qs.length}</b></div>`:`
  <div style="font-size:12px;color:var(--orange);margin-bottom:8px">🔁 重做模式：只重做错题</div>
  <div class="quiz-head"><span>${esc(kp.t)} · 错题重做</span><b>${KP.qIdx+1}/${qs.length}</b></div>`}
  <div class="quiz-progress"><i style="width:${KP.qIdx/Math.max(1,qs.length)*100}%"></i></div>
  <div class="q-card">
    <div class="qidx">${KP.redo?"重做":"练习"} 第 ${KP.qIdx+1} 题</div>
    <div class="qtext">${esc(q.t)}</div>
    ${q.o.map((o,i)=>`<div class="opt ${answered?(i===q.a?"correct":(ans===i?"wrong":"")):""} ${answered?"disabled":""}" onclick='${answered?"":"kpAnswer("+i+")"}'>
      <span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></div>`).join("")}
    <div class="explain ${answered?"show":""}">${answered?`<b>解析：</b>${esc(q.h)}`:""}</div>
    ${answered?`<button class="btn primary" style="margin-top:14px" onclick='kpNext()'>${KP.qIdx===qs.length-1?(KP.redo?"完成重做":"完成测试"):"下一题"}</button>`:`<button class="btn ghost sm" onclick='tts.speak("${esc(q.t.replace(/[？?]/g,"。"))}","zh")'>🔊 语音读题</button>`}
  </div>
  ${allDone?`<div class="card" style="padding:14px;margin-top:10px">${kpResult()}</div>`:""}`;
}
function kpResult(){
  const total=KP.attempts||KP.qHist.length;
  const rate=Math.round(KP.correct/Math.max(1,total)*100);
  const passed=rate>=80;
  const mid=KP.mid, kp=D.MATH_MODULES.find(x=>x.id===mid).kps[KP.ki];
  if(passed){
    if(!S.mathKpDone)S.mathKpDone={};
    S.mathKpDone[mid+"|"+kp.t]={score:rate,tries:(S.mathKpDone[mid+"|"+kp.t]?.tries||0)+1,correct:KP.correct,date:todayStr()};
    if(!KP.redo){
      const wrongs=(S.mathWrong||[]).filter(w=>w.mid===mid&&w.kp===kp.t);
      wrongs.forEach(w=>delWrong(mid,w.q.t));
    }
    S.save();
  }
  return `<div style="text-align:center">
    <div style="font-size:20px;font-weight:800;color:${passed?"var(--green)":"var(--orange)"}">正确率 ${rate}% · ${passed?"已掌握 🎉":"再接再厉 💪"}</div>
    <div style="font-size:12px;color:var(--ink-2);margin:6px 0 12px">${passed?"恭喜通过！错题已自动移出错题库。":"正确率需达到 80% 才通过。可查看解析后重做错题。"}</div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" onclick='kpTab("video")'>↩ 返回讲解</button>
      ${passed?`<button class="btn primary" onclick='go("kp",{mid:"${mid}",ki:${KP.ki}});setTimeout(()=>{KP.qIdx=0;KP.qHist=[];KP.qDone=false;KP.attempts=0;KP.correct=0;render()},10)'>再练一遍</button>`
      :`<button class="btn primary" onclick='kpRedo()'>🔁 重做错题</button>`}
      <button class="btn ghost" onclick='go("mdetail",{mid:"${mid}"})'>模块首页</button>
    </div>
  </div>`;
}
function kpAnswer(i){
  const m=D.MATH_MODULES.find(x=>x.id===KP.mid);
  const kp=m.kps[KP.ki];
  const qs=KP.redo?KP.qHist.map(h=>h.q):kp.qs;
  const q=qs[KP.qIdx];
  KP.qHist[KP.qIdx]=i;
  KP.attempts++;
  S.answerTotal++;if(i===q.a)S.correctTotal++;
  if(i===q.a){KP.correct++;if(!KP.redo){delWrong(m.id,q.t)}}
  else addWrong({mid:m.id,kp:kp.t,q,chosen:i});
  S.save();
  render();
}
function kpNext(){
  const m=D.MATH_MODULES.find(x=>x.id===KP.mid);
  const kp=m.kps[KP.ki];
  const qs=KP.redo?KP.qHist.map(h=>h.q):kp.qs;
  if(KP.qIdx<qs.length-1){KP.qIdx++;render();return}
  KP.qDone=true;
  render();
}
function kpRedo(){
  const m=D.MATH_MODULES.find(x=>x.id===KP.mid);
  const kp=m.kps[KP.ki];
  const wrongs=(S.mathWrong||[]).filter(w=>w.mid===m.id&&w.kp===kp.t);
  if(!wrongs.length){toast("当前没有错题","ok");return}
  KP.redo=true;KP.qIdx=0;KP.qHist=[];KP.qDone=false;KP.attempts=0;KP.correct=0;
  KP.redoList=wrongs;
  render();
}
function getKPMastery(mid,t){
  const done=S.mathKpDone||{};
  const d=done[mid+"|"+t];
  if(!d)return{score:0,tries:0,correct:0};
  const wrongs=(S.mathWrong||[]).filter(w=>w.mid===mid&&w.kp===t).length;
  return{score:Math.max(0,Math.min(100,d.score-wrongs*8)),tries:d.tries,correct:d.correct,passed:d.score>=80};
}

let DICT={mode:"normal",list:[],idx:0,correct:0,wrong:0,total:0,revealed:false,result:null};
function renderDict(){
  if(!DICT.list.length){
    if(nav.mode==="wrong"&&S.wrongWords.length){
      DICT={mode:"wrong",list:S.wrongWords.slice(),idx:0,correct:0,wrong:0,total:S.wrongWords.length,revealed:false,result:null};
    }else{
      const pool=S.wrongWords.length?S.wrongWords.slice(0,20):D.WORD_BANK.slice(0,20);
      DICT={mode:"normal",list:pool,idx:0,correct:0,wrong:0,total:pool.length,revealed:false,result:null};
    }
  }
  return dictFlow();
}
function dictFlow(){
  if(DICT.idx>=DICT.list.length){
    const rate=Math.round(DICT.correct/DICT.total*100);
    return `<div class="card" style="padding:22px;text-align:center">
      <div class="bigword">🎉</div>
      <div style="font-size:18px;font-weight:800;margin-top:6px">听写完成</div>
      <div class="stat-grid" style="margin-top:16px">
        <div class="stat-cell"><b style="color:var(--green)">${DICT.correct}</b><span class="lab">正确</span></div>
        <div class="stat-cell"><b style="color:var(--red)">${DICT.wrong}</b><span class="lab">错误</span></div>
      </div>
      <div class="bar-row" style="margin:16px 0"><span class="lbl">正确率</span><div class="track"><i style="width:${rate}%;background:${rate>=80?"var(--green)":rate>=60?"var(--orange)":"var(--red)"}"></i></div><span class="val">${rate}%</span></div>
      <div style="font-size:12px;color:var(--ink-2)">${rate>=80?"太棒了，继续巩固高频词！":rate>=60?"不错，错词已加入错词本复习":"建议先去单词库浏览，再来听写"}</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn primary" onclick='restartDict()'>再来一轮</button>
      <button class="btn ghost" onclick='go("learn",{sub:"eng"})'>返回</button>
    </div>
    ${tabbar()}`;
  }
  const w=DICT.list[DICT.idx];
  return `
  <div class="quiz-head"><span>${DICT.mode==="wrong"?"⚠️ 错词复习":"🎧 单词听写"}</span><b>${DICT.idx+1}/${DICT.total}</b></div>
  <div class="quiz-progress"><i style="width:${DICT.idx/DICT.total*100}%"></i></div>
  <div class="dict-card">
    <div class="dict-flash">
      ${DICT.revealed?`<span class="verdict ${DICT.result?"ok":"no"}">${DICT.result?"✔ 回答正确":"✘ 正确答案："+w.w}</span>`:`<span style="color:var(--ink-3);font-size:13px">点击喇叭听发音，输入英文单词</span>`}
    </div>
    ${!DICT.revealed?`<div class="word-ph">🔊 听音拼写</div>`:`
    <div class="word-ph">${w.w} ${w.ph?`<span style="font-size:12px">${w.ph}</span>`:""}</div>
    <div class="word-meaning">${esc(w.def)}${w.ex?` · ${esc(w.ex)}`:""}</div>`}
    <button class="speaker ${DICT.revealed?"":"playing"}" onclick='dictSpeak("${w.w}")'>🔊</button>
  </div>
  <div class="answer-box">
    <input class="inline-input" id="dictInput" placeholder="输入英文单词…" ${DICT.revealed?"disabled":""} onkeydown='if(event.key==="Enter")checkDict()'>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn primary" onclick='${DICT.revealed?"dictNext()":"checkDict()"}'>${DICT.revealed?"下一词 ›":"判分 ✓"}</button>
      ${!DICT.revealed?`<button class="btn ghost" onclick='dictReveal()'>显示答案</button>`:""}
    </div>
  </div>
  ${tabbar()}`;
}
function dictSpeak(w){tts.speak(w,"en");}
function dictReveal(){
  DICT.revealed=true;DICT.result=false;DICT.wrong++;
  const w=DICT.list[DICT.idx];
  if(!S.wrongWords.includes(w.w))S.wrongWords.push(w.w);
  S.save();
  render();renderDict();focusDict();
}
function checkDict(){
  const w=DICT.list[DICT.idx];
  const inp=$("#dictInput");const ans=(inp.value||"").trim().toLowerCase();
  if(!ans){toast("请输入单词","err");return}
  DICT.revealed=true;
  if(ans===w.w.toLowerCase()){DICT.result=true;DICT.correct++;}
  else{DICT.result=false;DICT.wrong++;if(!S.wrongWords.includes(w.w))S.wrongWords.push(w.w);}
  S.save();
  render();focusDict();
}
function dictNext(){
  DICT.idx++;DICT.revealed=false;DICT.result=null;
  render();renderDict();focusDict();
}
function restartDict(){
  const pool=DICT.mode==="wrong"?S.wrongWords.slice():D.WORD_BANK.slice(0,20);
  DICT={mode:DICT.mode,list:pool,idx:0,correct:0,wrong:0,total:pool.length,revealed:false,result:null};
  render();renderDict();
}
function focusDict(){
  const el=$("#dictInput");if(el&&!el.disabled){el.focus();}
}

/* ============================ 背诗 ============================ */
let POEM={pid:null,idx:0,blanked:[],mode:"fill",correct:0,finished:false};
function renderPoem(){
  if(!POEM.pid)POEM.pid=nav.pid||D.POEMS[0].id;
  const p=D.POEMS.find(x=>x.id===POEM.pid);
  if(POEM.pid!==(nav.pid||D.POEMS[0].id)&&nav.pid){POEM={pid:nav.pid,idx:0,blanked:[],mode:"fill",correct:0,finished:false};}
  if(!p)return `<div class="empty">篇目不存在</div>${tabbar()}`;
  const done=S.poemDone.includes(p.id);
  return `
  <div class="card" style="padding:16px">
    <div class="sec-title" style="margin:0 0 4px"><h3>《${esc(p.t)}》</h3></div>
    <div class="kv"><span class="k">作者</span><span class="v">${esc(p.a)} · ${esc(p.d)}</span></div>
    <div class="kv"><span class="k">出处</span><span class="v">${esc(p.loc)}</span></div>
    ${done?`<div class="pill-ok" style="margin-top:8px">✅ 已背诵</div>`:""}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn sm primary" onclick='tts.speak("${esc(p.lines.join("，").replace(/[，。]/g,"，"))}")'>🔊 全文朗读</button>
      <button class="btn sm ghost" onclick='switchPoem("${p.id}")'>↻ 上一篇</button>
      <button class="btn sm ghost" onclick='switchPoem("${nextPoemId(p.id)}")'>下一篇 ↻</button>
    </div>
  </div>

  <div class="subtab" style="margin:14px 0">
    <button class="${POEM.mode==="fill"?"active":""}" onclick='setPoemMode("fill")'>✏️ 填空背诵</button>
    <button class="${POEM.mode==="compre"?"active":""}" onclick='setPoemMode("compre")'>🎯 理解性默写</button>
  </div>
  ${POEM.mode==="fill"?poemFill(p):poemCompre(p)}
  ${tabbar()}`;
}
function nextPoemId(id){
  const i=D.POEMS.findIndex(x=>x.id===id);
  return D.POEMS[(i+1)%D.POEMS.length].id;
}
function switchPoem(id){
  POEM={pid:id,idx:0,blanked:[],mode:POEM.mode,correct:0,finished:false};
  nav.pid=id;
  render();
}
function setPoemMode(m){
  POEM={pid:POEM.pid,idx:0,blanked:[],mode:m,correct:0,finished:false};
  render();
}
function poemFill(p){
  if(!POEM.blanked.length){
    // 随机挖空每行的一半（偶数行）
    POEM.blanked=p.lines.map(l=>false);
    // 挖掉奇数索引行
    p.lines.forEach((_,i)=>{if(i%2===1)POEM.blanked[i]=true;});
    // 至少挖2空
  }
  const remaining=POEM.blanked.filter(b=>b).length;
  const linesHtml=p.lines.map((line,i)=>{
    if(POEM.blanked[i]){
      return `<div class="poem-line"><span class="pl">${esc(line.slice(0,Math.floor(line.length/2)))}</span><span class="blank ${POEM.blanked[i]===2?"done":""}" onclick='poemRevealBlank(${i})'>${POEM.blanked[i]===2?esc(line.slice(Math.floor(line.length/2))):"点击填此空"}</span></div>`;
    }
    return `<div class="poem-line"><span class="pl">${esc(line)}</span></div>`;
  }).join("");
  return `
  <div style="font-size:12px;color:var(--ink-3);margin:0 2px 10px">还剩 ${remaining} 处填空 · 点击空位查看答案并计一次巩固</div>
  <div class="card" style="padding:18px;text-align:center">
    <div style="line-height:2">${linesHtml}</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:10px">
    <button class="btn ghost" onclick='poemNewRound("${p.id}")'>↻ 重新挖空</button>
    <button class="btn primary" onclick='tts.speak("${esc(p.lines.join("，"))}")'>🔊 再听一遍</button>
  </div>`;
}
function poemRevealBlank(i){
  if(POEM.blanked[i]===2)return;
  POEM.blanked[i]=2;
  POEM.correct++;
  if(!S.poemDone.includes(POEM.pid))S.poemDone.push(POEM.pid);
  S.save();
  render();renderPoem();
}
function poemNewRound(id){
  POEM={pid:id,idx:0,blanked:[],mode:"fill",correct:0,finished:false};
  render();
}
function poemCompre(p){
  const q=p.qa[POEM.idx%p.qa.length];
  const answered = POEM.blanked[0]!=null;
  return `
  <div class="q-card">
    <div class="qidx">理解性默写 ${(POEM.idx%p.qa.length)+1}</div>
    <div class="qtext">${esc(q.p)}</div>
    <div class="explain ${answered?"show":""}">${answered?`<b>参考答案：</b>${esc(q.a)}`:""}</div>
    ${!answered?`
    <div class="tip-box">先在心里默念答案，再点击「显示答案」对照。建议顺便在心里把整首诗默背一遍。</div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn primary" onclick='poemShowAnswer("${q.a}")'>显示答案</button>
      <button class="btn ghost" onclick='poemSkip()'>跳过</button>
    </div>`:`
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn primary" onclick='poemCompreNext()'>下一题</button>
      <button class="btn ghost" onclick='tts.speak("${esc(q.a)}")'>🔊 朗读答案</button>
    </div>`}
  </div>`;
}
function poemShowAnswer(ans){
  POEM.blanked[0]=1;POEM.correct++;
  if(!S.poemDone.includes(POEM.pid))S.poemDone.push(POEM.pid);
  S.save();
  render();renderPoem();
}
function poemSkip(){POEM.blanked[0]=1;render();renderPoem();}
function poemCompreNext(){
  POEM.idx++;POEM.blanked=[];
  render();renderPoem();
}

/* ============================ AI 答疑 ============================ */
const AI={
  stopStreaming:false,
  reply(raw){
    const q=raw.trim();
    const L=q.toLowerCase();
    // 大学知识检测（优先）
    const hasUni=/高数|高等数学|微积分|极限|导数.*大学|线性代数|矩阵|行列式|向量空间|概率论|数理统计|大学物理|高等代数|离散数学|复变|微分方程|积分|傅里叶|泰勒|拉格朗日|四六级|CET|雅思|托福|GRE|大学英语|考研|高等数学/i.test(q);
    if(hasUni)return this.uniReply(q);
    // 匹配学科
    const hasMath=/[数(学]|数学|函数|导数|数列|三角|向量|几何|概率|不等式|集合|log|sin|cos|求导|积分|方程|△|√|π|因式分解|一元二次|一次函数|反比例|勾股|代数|未知数|等于/i.test(q);
    const hasEng=/英|英语|单词|单词|听写|语法|词性|句|reading|vocabulary|grammar|english|tense|word|be动词|时态|一般现在时|过去时/i.test(L+q);
    const hasCn=/语文|古诗|文言|诗|词|作文|默写|背诵|实词|虚词|成语|病句|诗句|论语|桃花源记/i.test(q);
    if(hasMath&&!hasEng)return this.mathReply(q);
    if(hasEng)return this.engReply(q);
    if(hasCn)return this.cnReply(q);
    if(/学习计划|计划|安排|怎么学|怎么提分|提升|提分|规划/i.test(q))return this.planReply(q);
    if(/错词|错题本|错题|单词/i.test(q))return this.engReply(q);
    if(/你好|嗨|hi|hello|在吗|谢谢|你是谁|你能/i.test(L))return "你好呀！我是你的AI学习助手 🤖\n\n我能为你解答：\n\n📚 **初中基础**：代数、方程、函数、几何、单词、语法、古诗文言\n🧑‍🎓 **高中知识**：三角、导数、数列、圆锥曲线、3500词、72篇古诗文\n🎓 **大学拓展**：高等数学、线性代数、概率统计、四六级、专业基础\n\n直接问我任何问题就行～";
    return `这个问题我来帮你分析～

**关于「${q}」**，建议这样入手：
1️⃣ 先确认属于初中、高中还是大学阶段的知识点
2️⃣ 拆成小问题：已知什么？要求什么？需要什么方法？
3️⃣ 遇到卡点，把它单独拎出来问得更具体

你可以把题目或原句发给我，我帮你分步讲解 😊`;
  },
  mathReply(q){
    // —— 初中基础 ——
    if(/一元二次|方程.*解|解.*方程|x.*=/.test(q)&&/初中|解方程|方程/.test(q))return "✏️ **解一元二次方程 3 种方法**：\n\n① **因式分解**：x²-5x+6=0 → (x-2)(x-3)=0 → x=2 或 3\n② **配方法**：x²+4x+1=0 → (x+2)²=3 → x=-2±√3\n③ **公式法**：x = [-b±√(b²-4ac)] / 2a（万能的！）\n\n判别式 Δ=b²-4ac：Δ>0 两实根、Δ=0 重根、Δ<0 无实根。";
    if(/因式分解|提公因|平方差|完全平方|十字/.test(q))return "🔧 **因式分解技巧**：\n\n① 提公因式：ax+ay=a(x+y)\n② 平方差：a²-b²=(a+b)(a-b)\n③ 完全平方：a²±2ab+b²=(a±b)²\n④ 十字相乘：x²+(p+q)x+pq=(x+p)(x+q)\n\n例：x²-9=(x+3)(x-3)；x²+6x+9=(x+3)²。";
    if(/一次函数|y=kx|反比例|y=k\/x|k≠0/.test(q))return "📈 **一次函数 & 反比例函数**：\n\n**一次函数** y=kx+b（k≠0）：\n• k>0 图像上升（y 随 x 增大而增大）\n• b 是截距，决定与 y 轴交点\n\n**反比例函数** y=k/x（k≠0）：\n• k>0 图像在一、三象限\n• k<0 图像在二、四象限\n\n画图关键：找两点连线（一次），描几个点连线（反比例）。";
    if(/勾股|直角三角形|斜边|3,4,5|3 4 5/.test(q))return "📐 **勾股定理**：\n\n在直角三角形中：**a² + b² = c²**（c 为斜边）\n\n常见勾股数：3-4-5、6-8-10、5-12-13\n\n例：直角边 6、8，斜边 = √(36+64) = 10。\n\n⚠️ 别忘了验证哪条边是斜边（最长边）。";
    if(/圆|周长|面积|半径|直径|π/.test(q)&&/圆|半径|直径/.test(q))return "⭕ **圆的基础公式**：\n\n• 周长：C = 2πr = πd\n• 面积：S = πr²\n• 直径：d = 2r\n\n例：半径 3 的圆，面积 = 9π。\n\n圆周角定理：同弧所对圆周角 = 圆心角的一半。";

let streaming=false;
function sendChat(){
  if(streaming)return;
  const inp=$("#chatIn");const v=(inp.value||"").trim();
  if(!v)return;
  inp.value="";
  S.chat.push({role:"me",txt:v});S.save();render();

function localChat(v){
  const reply=AI.reply(v);
  streamReply(reply);
}
function streamReply(full){
  const log=$("#chatlog");
  if(!log){S.chat.push({role:"ai",txt:full});S.save();streaming=false;return}
  // 创建占位气泡
  const idx=S.chat.length;
  S.chat.push({role:"ai",txt:""});
  log.innerHTML+=`<div class="msg ai" id="msg${idx}"><span class="av">🤖</span><div class="bubble cursor-blink" id="bub${idx}"></div></div>`;
  const bub=$("#bub"+idx);
  let i=0;
  const chunk=()=>{
    const el=$("#bub"+idx);
    if(!el){streaming=false;return;}
    if(i>=full.length){
      el.classList.remove("cursor-blink");
      S.chat[idx].txt=full;S.save();streaming=false;
      return;
    }
    const step=3+Math.floor(Math.random()*4);
    el.textContent=full.slice(0,i+step);
    el.innerHTML=el.textContent.replace(/\n/g,"<br>");
    i+=step;
    const l2=$("#chatlog");if(l2)l2.scrollTop=l2.scrollHeight;
    setTimeout(chunk,16+Math.random()*30);
  };
  chunk();
}

function checkin(){
  const today=todayStr();
  if(S.lastCheckin===today)return;
  S.checkins.push(today);
  S.lastCheckin=today;
  // 计算连续
  const arr=[...S.checkins].sort();
  let streak=1;
  const last=new Date(today+"T00:00:00");
  for(let i=arr.length-2;i>=0;i--){
    const d=new Date(arr[i]+"T00:00:00");
    const diff=(last-d)/86400000;
    if(diff===streak)streak++;
    else break;
  }
  S.streak=streak;
  S.save();
  toast("打卡成功！连续 "+streak+" 天 🔥","ok");
  render();
}

function drawRadar(){
  const c=$("#radar");if(!c)return;
  const ctx=c.getContext("2d");
  const W=300,H=200,cx=W/2,cy=105,baseR=75;
  const labels=["数学","英语","语文"];
  const scores=[S.report.scores.math,S.report.scores.english,S.report.scores.chinese];
  const colors=["#2f7df6","#10b981","#f59e0b"];
  ctx.clearRect(0,0,W,H);
  // 网格
  for(let r=1;r<=5;r++){
    ctx.beginPath();
    for(let i=0;i<3;i++){
      const a=Math.PI/2+i*2*Math.PI/3;
      const x=cx+baseR*r/5*Math.cos(a),y=cy-baseR*r/5*Math.sin(a);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.strokeStyle="#dfe4ee";ctx.stroke();
  }
  // 轴线
  for(let i=0;i<3;i++){
    const a=Math.PI/2+i*2*Math.PI/3;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+baseR*Math.cos(a),cy-baseR*Math.sin(a));
    ctx.strokeStyle="#dfe4ee";ctx.stroke();
  }
  // 数据
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const a=Math.PI/2+i*2*Math.PI/3;
    const r=baseR*scores[i]/100;
    const x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle="rgba(47,125,246,.15)";ctx.fill();
  ctx.strokeStyle="#2f7df6";ctx.lineWidth=2;ctx.stroke();
  // 顶点
  for(let i=0;i<3;i++){
    const a=Math.PI/2+i*2*Math.PI/3;
    const r=baseR*scores[i]/100;
    ctx.beginPath();ctx.arc(cx+r*Math.cos(a),cy-r*Math.sin(a),3.5,0,7);
    ctx.fillStyle=colors[i];ctx.fill();
    // label
    ctx.fillStyle=colors[i];ctx.font="bold 12px sans-serif";
    ctx.textAlign="center";
    const lx=cx+(baseR+16)*Math.cos(a),ly=cy-(baseR+16)*Math.sin(a)+4;
    ctx.fillText(`${labels[i]} ${scores[i]}`,lx,ly);
  }
}
function drawRing(){
  const c=$("#ring");if(!c)return;
  const ctx=c.getContext("2d");
  const score=S.report.total;
  const frac=score/100;
  const start=-Math.PI/2;
  ctx.clearRect(0,0,92,92);
  ctx.beginPath();ctx.arc(46,46,40,0,7);
  ctx.strokeStyle="#eceef3";ctx.lineWidth=9;ctx.stroke();
  ctx.beginPath();ctx.arc(46,46,40,start,start+2*Math.PI*frac);
  ctx.strokeStyle=score>=80?"#10b981":score>=65?"#22c55e":score>=50?"#f59e0b":"#ef4444";
  ctx.lineWidth=9;ctx.lineCap="round";ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle;ctx.font="bold 24px sans-serif";ctx.textAlign="center";
  ctx.fillText(score,46,54);
}

  ctx.beginPath();ctx.arc(23,23,19,-Math.PI/2,-Math.PI/2+2*Math.PI*score/100);
  ctx.strokeStyle=score>=80?"#10b981":score>=50?"#f59e0b":"#ef4444";
  ctx.lineWidth=5;ctx.lineCap="round";ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle;ctx.font="bold 9px sans-serif";ctx.textAlign="center";
  ctx.fillText(score+"%",23,27);
}
applyTheme();
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{tts.pickVoice("zh")};}

// 启动
go("home");

</script>
