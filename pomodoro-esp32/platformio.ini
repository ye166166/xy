[platformio]
default_envs = esp32-s3

; ============================================================
; 番茄时钟 ESP32-S3 工程
; 目标硬件: M5Stack Cardputer（ST7789 屏幕 / QWERTY 键盘 / I2S 扬声器 / BMI270）
; 若为其他 ESP32-S3 板子，请修改 board 并对照 include/config.h 调整引脚。
; ============================================================

[env:esp32-s3]
platform = espressif32@^6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Cardputer@^1.1.1
