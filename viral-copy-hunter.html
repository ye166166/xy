<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff5a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>爆款文案雷达 · 视频号/抖音/小红书</title>
<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --ink:#1a1d26;
  --ink-2:#6b7280;
  --ink-3:#9aa1ad;
  --line:#eceef3;
  --brand:#ff5a5f;
  --brand-g:#ff8a5c;
  --dy:#1a1a1a;
  --xhs:#ff2442;
  --shipin:#07c160;
  --like:#ff5a5f;
  --radius:16px;
  --shadow:0 2px 12px rgba(20,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  max-width:560px;margin:0 auto;padding-bottom:70px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{display:none}
.page{display:none;padding:0 14px 20px;animation:fadein .25s ease}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.appbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--brand),var(--brand-g));
  color:#fff;padding:14px 14px 16px;border-radius:0 0 22px 22px;
  box-shadow:0 4px 18px rgba(255,90,95,.28);
}
.appbar .row{display:flex;align-items:center;justify-content:space-between}
.appbar h1{font-size:19px;font-weight:800;letter-spacing:.5px}
.appbar h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.appbar .sub{font-size:11px;opacity:.85;margin-top:3px}
.searchwrap{margin-top:12px;display:flex;gap:8px}
.searchbox{
  flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:10px 14px;
}
.searchbox svg{flex:none;opacity:.45}
.searchbox input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--ink)}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .clear{font-size:13px;color:var(--ink-3);padding:2px;display:none}
.searchbox .clear.show{display:block}
.searchbtn{background:#fff;color:var(--brand);font-weight:700;font-size:13px;border:none;border-radius:14px;padding:0 16px;cursor:pointer}
.hotkw{margin-top:10px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding-bottom:2px}
.hotkw span{font-size:11px;background:rgba(255,255,255,.22);color:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;flex:none}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;margin:14px 2px 4px;overflow-x:auto}
.chip{
  flex:none;font-size:13px;font-weight:600;padding:8px 16px;border-radius:99px;
  background:#fff;color:var(--ink-2);border:1px solid var(--line);cursor:pointer;transition:.15s;
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .count{font-size:10px;opacity:.6;margin-left:2px}
.sortbar{display:flex;align-items:center;gap:10px;margin:10px 2px 12px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.sortbar .sort{font-size:12px;color:var(--ink-3);cursor:pointer;padding:4px 2px;display:flex;align-items:center;gap:2px;flex:none}
.sortbar .sort.active{color:var(--brand);font-weight:700}
.sortbar .countlabel{margin-left:auto;flex:none;padding-left:6px}
.sortbar .countlabel{margin-left:auto;font-size:11px;color:var(--ink-3)}

/* ---------- cards ---------- */
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:14px;overflow:hidden;cursor:pointer;transition:transform .12s;
}
.card:active{transform:scale(.985)}
.card .badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#fff;
  padding:3px 8px;border-radius:6px;margin:14px 14px 0;
}
.badge.dy{background:var(--dy)}
.badge.xhs{background:var(--xhs)}
.badge.sp{background:var(--shipin)}
.badge svg{width:11px;height:11px;fill:#fff}
.catchip{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:6px;margin:14px 14px 0;border:1px solid transparent;
}
.catchip.c0{background:#ffecec;color:#ff5a5f;border-color:#ffd6d6}
.catchip.c1{background:#eef0ff;color:#6366f1;border-color:#dfe3ff}
.catchip.c2{background:#fff7e6;color:#f59e0b;border-color:#ffe9bf}
.catchip.c3{background:#ffe9f4;color:#ec4899;border-color:#ffd2e8}
.scorechip{
  display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;
  background:linear-gradient(135deg,#fff7e6,#ffe9f4);color:#e8590c;border:1px solid #ffe0c2;
  padding:3px 8px;border-radius:6px;margin:14px 14px 0;
}
.scorechip b{font-size:12px}
.card .title{font-size:16px;font-weight:700;line-height:1.4;padding:10px 14px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .excerpt{font-size:13px;color:var(--ink-2);line-height:1.6;padding:8px 14px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.tag{font-size:10px;color:var(--brand);background:#fff1f1;border:1px solid #ffe1e1;padding:3px 8px;border-radius:6px}
.author{
  display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:10px;
  border-top:1px solid var(--line);
}
.avatar{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;flex:none;
}
.author .info{flex:1;min-width:0}
.author .name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.author .name .v{color:#fff;background:var(--brand);font-size:9px;padding:1px 4px;border-radius:4px;font-style:normal}
.author .fans{font-size:11px;color:var(--ink-3);margin-top:2px}
.author .vip{display:flex;align-items:center;justify-content:center;width:14px;height:14px;flex:none;margin-left:2px}
.followbtn{
  flex:none;font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px;
  background:var(--brand);color:#fff;cursor:pointer;border:none;
}
.followbtn.following{background:#f1f2f5;color:var(--ink-2)}
.stats{display:flex;gap:0;background:#fafbfd;padding:10px 0;border-top:1px solid var(--line)}
.stat{flex:1;text-align:center;font-size:11px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:4px}
.stat b{color:var(--ink);font-weight:700}
.stat svg{opacity:.55}
.actions{display:flex;border-top:1px solid var(--line)}
.act{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12px;color:var(--ink-2);padding:11px 0;cursor:pointer;
}
.act.liked{color:var(--like)}
.act.liked svg{fill:var(--like)}
.act.saved{color:#f5a623}
.act svg{flex:none}

/* ---------- tabs ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;height:60px;background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:60;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--ink-3);cursor:pointer}
.tab.active{color:var(--brand)}
.tab svg{width:22px;height:22px}

/* ---------- detail sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:100;display:none;
}
.sheet.show{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fadein .2s}
.sheet .body{
  position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
  background:#fff;border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;
  animation:slideup .28s cubic-bezier(.2,.8,.2,1);
  padding:14px 18px 30px;
}
@keyframes slideup{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.sheet .handle{width:40px;height:4px;border-radius:99px;background:#e5e7ec;margin:4px auto 14px}
.sheet .close{position:absolute;top:14px;right:16px;font-size:13px;color:var(--ink-2);background:#f1f2f5;padding:6px 12px;border-radius:99px;cursor:pointer;z-index:2}

/* ---------- blogger profile ---------- */
.profile .cover{height:70px;border-radius:14px;background:linear-gradient(120deg,var(--brand),var(--brand-g));margin-bottom:-30px}
.profile .avatarbig{width:72px;height:72px;border-radius:50%;font-size:34px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 4px 12px;border:3px solid #fff;box-shadow:var(--shadow)}
.profile h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:6px}
.profile h2 .v{color:#fff;background:var(--brand);font-size:10px;padding:2px 5px;border-radius:4px}
.profile .bio{font-size:12px;color:var(--ink-2);line-height:1.6;margin:6px 0 14px}
.fansgrid{display:flex;background:#fafbfd;border-radius:14px;padding:14px 0;margin-bottom:16px;border:1px solid var(--line)}
.fansgrid .cell{flex:1;text-align:center}
.fansgrid .cell b{display:block;font-size:16px;font-weight:800}
.fansgrid .cell span{font-size:10px;color:var(--ink-3)}
.recenthead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:6px 2px 10px}
.recenthead .more{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:400}

/* ---------- copy detail ---------- */
.detail .plink{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-bottom:12px}
.detail .plink b{color:var(--brand)}
.detail .dtitle{font-size:19px;font-weight:800;line-height:1.45;margin-bottom:12px}
.copybox{
  background:#f7f8fb;border-radius:14px;padding:14px;font-size:14px;line-height:1.8;color:#2c3038;
  border:1px dashed #d9dde5;white-space:pre-wrap;word-break:break-word;
}
.copybox .ctitle{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.copybtn{
  width:100%;margin-top:14px;background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;
  border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
}
.hookline{font-size:12px;color:var(--ink-3);text-align:center;margin-top:8px}
.detail .secline{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.sec{font-size:10px;color:var(--ink-2);background:#f1f2f5;padding:4px 10px;border-radius:99px}
.scorewrap{background:linear-gradient(135deg,#fff7f2,#fff1f6);border:1px solid #ffe4d9;border-radius:14px;padding:14px;margin-bottom:16px}
.scorehead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.scorehead b{font-size:20px;color:var(--brand);font-weight:800}
.scorebar{height:8px;background:#ffe4d9;border-radius:99px;overflow:hidden}
.scorebar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-g));border-radius:99px}
.scoreitems{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.scoreitem{flex:1;min-width:76px;text-align:center;font-size:10px;color:var(--ink-3)}
.scoreitem b{display:block;font-size:14px;color:var(--ink);font-weight:800;margin-bottom:2px}
.relatedhead{font-size:13px;font-weight:700;margin:18px 0 10px}

/* ---------- favorites / mine ---------- */
.empty{
  text-align:center;padding:70px 30px;color:var(--ink-3);font-size:13px;
}
.empty .big{font-size:46px;margin-bottom:12px}
.historylist .card{margin-bottom:12px}
.minecell{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;cursor:pointer;
}
.minecell .icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ffe3e4,#fff0d9);display:flex;align-items:center;justify-content:center;font-size:18px}
.minecell .t{font-size:14px;font-weight:600}
.minecell .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.minecell .go{margin-left:auto;color:var(--ink-3);font-size:12px}
.mineprofile{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.mp-cover{height:64px;background:linear-gradient(120deg,var(--brand),var(--brand-g))}
.mp-row{display:flex;align-items:center;gap:12px;padding:0 14px 14px;margin-top:-22px}
.mp-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ffe3e4,#fff0d9);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow);flex:none}
.mp-name{font-size:16px;font-weight:800}
.mp-sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.statrow{display:flex;gap:10px;margin-bottom:14px}
.statrow .box{flex:1;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px;text-align:center}
.statrow .box b{font-size:22px;font-weight:800;color:var(--brand)}
.statrow .box span{font-size:11px;color:var(--ink-3)}
.exportbtn{
  flex:1;background:linear-gradient(135deg,var(--brand),var(--brand-g));color:#fff;border:none;
  border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;
}
.exportbtn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.edlabel{font-size:12px;font-weight:700;color:var(--ink-3);margin:4px 2px 8px}
.edinput{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;
  outline:none;margin-bottom:16px;background:#fafbfd;color:var(--ink);
}
.edinput:focus,.edtextarea:focus{border-color:var(--brand);background:#fff}
.edtextarea{
  width:100%;min-height:240px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:14px;line-height:1.7;outline:none;background:#fafbfd;color:var(--ink);
  resize:vertical;font-family:inherit;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,22,28,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;
  z-index:200;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skeleton{padding:4px 0}
.sk{background:#eef0f5;border-radius:var(--radius);height:170px;margin-bottom:14px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body>

<!-- ================= 顶栏 ================= -->
<header class="appbar">
  <div class="row">
    <h1><span class="dot"></span>爆款文案雷达</h1>
    <div style="font-size:11px;opacity:.9;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px">视频号 · 抖音 · 小红书</div>
  </div>
  <div class="sub">每日更新 400+ 条爆款文案 · 四大主题 + 博主数据</div>
  <div class="searchwrap">
    <div class="searchbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#666" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#666" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="kw" type="search" placeholder="搜索爆款文案 / 博主 / 关键词" autocomplete="off">
      <span class="clear" id="kwClear">✕</span>
    </div>
    <button class="searchbtn" onclick="doSearch()">搜索</button>
  </div>
  <div class="hotkw" id="hotkw"></div>
</header>

<!-- ================= 首页 ================= -->
<main id="page-home" class="page active">
  <div class="chips" id="platformChips"></div>
  <div class="sortbar" id="sortbar"></div>
  <div id="dailybar"></div>
  <div id="list"></div>
</main>

<!-- ================= 发现 ================= -->
<main id="page-find" class="page">
  <h2 style="font-size:17px;font-weight:800;margin:16px 2px 6px">今日热门话题</h2>
  <p style="font-size:12px;color:var(--ink-3);margin:0 2px 14px">根据爆款文案聚合的热点话题</p>
  <div id="topics"></div>
  <h2 style="font-size:17px;font-weight:800;margin:20px 2px 6px">热门博主榜单</h2>
  <p style="font-size:12px;color:var(--ink-3);margin:0 2px 14px">按粉丝量排名的爆款创作者</p>
  <div id="ranklist"></div>
</main>

<!-- ================= 收藏 ================= -->
<main id="page-save" class="page">
  <h2 style="font-size:17px;font-weight:800;margin:16px 2px 4px">我的好文</h2>
  <p style="font-size:12px;color:var(--ink-3);margin:0 2px 14px">收藏的文案存有完整快照，随时查看、提取、修改，不受每日换新影响</p>
  <div id="favlist"></div>
</main>

<!-- ================= 我的 ================= -->
<main id="page-mine" class="page">
  <div class="mineprofile">
    <div class="mp-cover"></div>
    <div class="mp-row">
      <div class="mp-avatar">🎯</div>
      <div>
        <div class="mp-name">爆款文案探索者</div>
        <div class="mp-sub" id="mineUpdate">今日已更新 0 条爆款文案</div>
      </div>
    </div>
  </div>
  <div class="statrow">
    <div class="box"><b id="mFav">0</b><span>好文收藏</span></div>
    <div class="box"><b id="mLike">0</b><span>点赞文案</span></div>
    <div class="box"><b id="mHis">0</b><span>浏览足迹</span></div>
  </div>
  <div class="minecell" onclick="switchPage('save')"><div class="icon">📖</div><div><div class="t">我的好文收藏</div><div class="s">查看、提取、编辑、导出收藏的好文</div></div><div class="go">›</div></div>
  <div class="minecell" onclick="clearData()"><div class="icon">🗑</div><div><div class="t">清空浏览记录</div><div class="s">删除本地足迹与缓存</div></div><div class="go">›</div></div>
  <div class="minecell" onclick="restoreDemo()"><div class="icon">🔄</div><div><div class="t">恢复演示数据</div><div class="s">重置为内置示例内容</div></div><div class="go">›</div></div>
  <div class="minecell" onclick="toast('数据均保存在本机浏览器中')"><div class="icon">🔒</div><div><div class="t">数据说明</div><div class="s">当前为本地演示数据，可替换为真实接口</div></div><div class="go">›</div></div>
</main>

<!-- ================= 详情弹层 ================= -->
<div class="sheet" id="sheet">
  <div class="mask" onclick="closeSheet()"></div>
  <div class="body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   爆款文案雷达 · 本地演示数据
   结构: { id, platform: 'dy'|'xhs'|'sp', title, content, tags[],
           author:{name, avatar(emoji), color, fans, likes, works, bio, verified},
           likes, comments, collects, date, hook }
   ===================================================== */
/* =====================================================
   爆款文案雷达 · 每日更新生成引擎（本地演示）
   基于「日期种子」每天生成 400+ 条最新爆款文案，
   当天内容稳定，次日自动换新。可点「换一批」重新生成。
   结构: { id, cat, platform, title, content, tags[],
           author:{name,avatar,color,fans,likes,works,bio,verified},
           likes,comments,collects,date,hook }
   接入真实数据：把 buildDaily() 换成接口返回即可。
   ===================================================== */
const CAT_LIST = ['情感共鸣','人生感悟','智慧人生','女性成长'];
const PLATFORMS = ['dy','xhs','sp'];
const ITEM_COUNT = 420;

const AUTHOR_POOL = [
  ['深夜书房','📖','6366f1','8b5cf6','sp',1800000,4200000,52000000,2409,'每晚9点，用文字治愈你的焦虑',1],

const STAT_RANGE = {
 '情感共鸣':[30,260,2,15,3,20],
 '人生感悟':[40,220,1.5,10,5,30],
 '智慧人生':[35,190,1,8,4,28],
 '女性成长':[30,200,2,14,5,28]

function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }
function idxShift(r, len){ return Math.floor(r()*len); }

const AUTHORS_BY_PLAT = {dy:[],xhs:[],sp:[]};
AUTHOR_POOL.forEach(a=>AUTHORS_BY_PLAT[a[4]].push(a));

let DEMO = [];

function buildDaily(seed){
  seed = seed || dayKey(new Date());
  const r = mulberry(hashStr(seed));
  const list = [];
  const usedTitles = new Set();
  let guard = 0;

  for(let i=0;i<ITEM_COUNT;i++){
    const platform = PLATFORMS[Math.floor(r()*3)];
    const cat = CAT_LIST[Math.floor(r()*4)];
    const F = FILLER[cat];
    const f0 = idxShift(r, F.length);
    let f = F[f0];
    let title = pick(r, TITLE_T[cat]).replace('{F}', f);

    let tries = 0;
    while(usedTitles.has(title) && tries<20){
      f = F[(f0 + ++tries) % F.length];
      title = pick(r, TITLE_T[cat]).replace('{F}', f);
    }
    usedTitles.add(title);

    const content = pick(r, CONTENT_T[cat]).replace('{F}', f) + '\n\n#' + TAG_POOL[cat].join(' #');
    const tags = [cat].concat(shuffleCopy(r, TAG_POOL[cat].slice(1)).slice(0,3));

    const au = pick(r, AUTHORS_BY_PLAT[platform]);
    const sr = STAT_RANGE[cat];
    const likes  = Math.round(sr[0] + (sr[1]-sr[0]) * r()) * 10000;
    const comments = Math.round(sr[2] + (sr[3]-sr[2]) * r()) * 10000;
    const collects = Math.round(sr[4] + (sr[5]-sr[4]) * r()) * 10000;

    list.push({
      id: i+1, cat, platform,
      title, content, tags,
      date: dayKey(new Date()),
      likes, comments, collects,
      hook: pick(r, HOOK_POOL[cat]),
      author: {
        name: au[0], avatar: au[1],
        color: 'linear-gradient(135deg,#'+au[2]+',#'+au[3]+')',
        platform: au[4],
        fans: Math.round(au[5] + (au[6]-au[5])*r()),
        likes: Math.round(au[7]*(0.6+r()*0.8)),
        works: Math.round(au[8]*(0.9+r()*0.2)),
        bio: au[9], verified: !!au[10]
      }
    });
  }
  DAILY_META = {date: dayKey(new Date()), count: list.length, seed};
  return list;
}
function shuffleCopy(r, arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function snapshotOf(d){
  return {
    ukey: ukeyOf(d),
    id: d.id, cat: d.cat, platform: d.platform,
    title: d.title, content: d.content, tags: (d.tags||[]).slice(),

  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function copyText(text, okMsg){
  const done = ()=>toast(okMsg||'✅ 已复制到剪贴板');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ legacyCopy(text); done(); });
  } else { legacyCopy(text); done(); }
}
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
}

function loadState(){
  try{ const s = localStorage.getItem(KEY); if(s) Object.assign(state, JSON.parse(s)); }catch(e){}
  if(!Array.isArray(state.favs)) state.favs=[];
  if(!Array.isArray(state.likes)) state.likes=[];
  if(!Array.isArray(state.views)) state.views=[];
  if(!Array.isArray(state.follows)) state.follows=[];
  state.kv = state.kv||{};
  // 兼容旧版：数字收藏 -> 转为快照
  state.favs = state.favs.map(x=>{
    if(typeof x==='number' || (typeof x==='string' && /^\d+$/.test(x))){
      const d = DEMO.find(t=>t.id===Number(x));
      return d ? snapshotOf(d) : null;
    }
    return x;
  }).filter(Boolean);
  state.favs.forEach(f=>{ if(f && typeof f==='object'){ f.savedAt=f.savedAt||Date.now(); f.edited=!!f.edited; } });
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function fmt(n){
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'亿';
  if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+'万';
  return n+'';
}

function score(d){
  // 综合热度: 点赞权重最高，评论/收藏辅助

}
function filterList(){
  let list = getPlatform();
  const q = ui.kw.trim().toLowerCase();
  if(q){
    list = list.filter(d=>
      d.title.toLowerCase().includes(q) ||
      d.content.toLowerCase().includes(q) ||
      d.author.name.toLowerCase().includes(q) ||
      (d.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }
  switch(ui.sort){
    case 'hot':   list.sort((a,b)=>score(b)-score(a)); break;
    case 'likes': list.sort((a,b)=>b.likes-a.likes); break;
    case 'scoreDesc': list.sort((a,b)=>scoreOf(b)-scoreOf(a)); break;
    case 'scoreAsc': list.sort((a,b)=>scoreOf(a)-scoreOf(b)); break;
    case 'new':   list.sort((a,b)=>b.date.localeCompare(a.date)); break;
  }
  return list;
}
function scoreOf(d){ return Math.min(100, Math.max(5, Math.round(score(d)/40000))); }

        <div class="stat">❤️ <b>${fmt(x.likes)}</b></div>
        <div class="stat">💬 <b>${fmt(x.comments)}</b></div>
        <div class="stat">⭐ <b>${fmt(x.collects)}</b></div>
      </div>
    </div>`).join('');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }

/* ---------- 博主主页 ---------- */
function openBlogger(id){
  const d = DEMO.find(x=>x.id===id); if(!d) return;
  const a = d.author;
  const works = DEMO.filter(x=>x.author.name===a.name);
  const isFollowing = state.follows.includes(a.name);
  const rank = DEMO.filter(x=>x.author.fans>a.fans).length+1;
  document.getElementById('sheetBody').innerHTML = `
    <div class="handle"></div><div class="close" onclick="closeSheet()">完成</div>
    <div class="profile">
      <div class="cover"></div>
      <div class="avatarbig" style="background:${a.color}">${a.avatar}</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2>${a.name}${a.verified?'<em class="v">大V</em>':''}</h2>
        <button class="followbtn ${isFollowing?'following':''}" onclick="toggleFollow('${a.name}')">${isFollowing?'已关注':'+ 关注'}</button>
      </div>
      <div class="bio">${a.bio}</div>
      <div class="fansgrid">
        <div class="cell"><b>${fmt(a.fans)}</b><span>粉丝</span></div>
        <div class="cell"><b>${fmt(a.likes)}</b><span>获赞</span></div>
        <div class="cell"><b>${fmt(a.works)}</b><span>作品</span></div>
        <div class="cell"><b>#${rank}</b><span>榜单排名</span></div>
      </div>
      <div class="recenthead">
        ${works.length>1?'🔥 该博主的爆款文案':'📝 博主资料'}
        <span class="more">${PLATFORM_META[d.platform].label}创作者</span>
      </div>
      ${works.length>1? works.map(cardHTML).join('') : `
        <div class="copybox" style="margin-top:8px">平台：${PLATFORM_META[d.platform].label}
主要领域：${d.tags.slice(0,3).join(' / ')}
简介：${a.bio}</div>`}
    </div>`;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetBody').scrollTop = 0;
}

/* ---------- 交互动作 ---------- */
function toggleLike(id){
  const i = state.likes.indexOf(id);
  i>=0 ? state.likes.splice(i,1) : state.likes.push(id);
  saveState(); renderList(); toast(i>=0?'已取消点赞':'❤️ 点赞成功');
}
function toggleFav(id){
  const d = DEMO.find(x=>x.id===id); if(!d) return;
  const uk = ukeyOf(d);
  const i = state.favs.findIndex(f=>f.ukey===uk);
  if(i>=0){
    state.favs.splice(i,1);
    saveState(); renderList(); renderMineStats(); toast('已取消收藏');
  } else {
    state.favs.unshift(snapshotOf(d));
    saveState(); renderList(); renderMineStats();
    toast('⭐ 已存入「我的好文」，可随时查看和修改');
  }
  if(ui.page==='save') renderFav();
}
function toggleFollow(name){
  const i = state.follows.indexOf(name);
  i>=0 ? state.follows.splice(i,1) : state.follows.push(name);
  saveState(); toast(i>=0?'已取消关注':'✅ 关注成功');
  if(ui.page==='find') renderRank();
  if(document.getElementById('sheet').classList.contains('show')) refreshSheet();
}
function copyContent(id){
  const d = DEMO.find(x=>x.id===id); if(!d) return;
  const text = `【${PLATFORM_META[d.platform].label}爆款】${d.title}\n\n${d.content}\n\n——来自 ${d.author.name} (粉丝${fmt(d.author.fans)})`;
  copyText(text, '✅ 文案已复制到剪贴板');
}
function refreshSheet(){
  // 关注状态变化后重渲染当前弹层
  const body = document.getElementById('sheetBody');
  const t = body.innerText;
  if(t.includes('博主资料') || t.includes('榜单排名')){ /* 博主页重开需原id */ }
}

/* ---------- 我的好文：查看 / 编辑 / 删除 / 导出 ---------- */
function favCardHTML(f){
  const tags = (f.tags||[]).slice(0,3).map(t=>`<span class="tag">#${t}</span>`).join('');
  return `
  <div class="card" onclick="openFavDetail('${f.ukey}')">
    ${badgeHTML(f)}${catChipHTML(f)}
    <div class="title">${esc(f.title)}</div>
    <div class="excerpt">${esc(String(f.content).split('\n')[0])}</div>
    <div class="favmeta">
      <span class="tag">📌 收藏于 ${fmtTime(f.savedAt)}</span>
      <span class="tag">${f.edited?'✍️ 已修改':'📝 原文'}</span>
    </div>
    <div class="actions">
      <div class="act" onclick="event.stopPropagation();openFavDetail('${f.ukey}')">👁 查看</div>
      <div class="act" onclick="event.stopPropagation();openEditor('${f.ukey}')">✏️ 编辑</div>
      <div class="act" onclick="event.stopPropagation();copyFav('${f.ukey}')">📋 复制</div>
      <div class="act" onclick="event.stopPropagation();delFav('${f.ukey}')">🗑 删除</div>
    </div>
  </div>`;
}
function renderFav(){
  const list = state.favs.slice();
  let html = '';
  if(list.length){
    html += `<div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="exportbtn" onclick="exportFavs()">📤 导出全部好文</button>
      </div>` + list.map(favCardHTML).join('');
  } else {
    const rec = [...DEMO].sort((a,b)=>score(b)-score(a)).slice(0,4);
    html += `<div class="empty"><div class="big">📖</div>还没有收藏好文<br>点卡片上的「收藏」即可保存到这里</div>`;
    html += `<div class="recenthead" style="margin:4px 2px 10px">🔥 热门精选 · 收藏后出现在上方</div>`;
    html += rec.map(recCardHTML).join('');
  }
  document.getElementById('favlist').innerHTML = html;
  renderMineStats();
}
function recCardHTML(d){
  return `
  <div class="card" onclick="openDetail(${d.id})">
    ${badgeHTML(d)}${catChipHTML(d)}${scoreChipHTML(d)}
    <div class="title" style="font-size:14px">${d.title}</div>
    <div class="stats" style="border-top:1px solid var(--line)">
      <div class="stat">❤️ <b>${fmt(d.likes)}</b></div>
      <div class="stat">💬 <b>${fmt(d.comments)}</b></div>
      <div class="stat">⭐ <b>${fmt(d.collects)}</b></div>
    </div>
    <div class="actions" style="border-top:1px solid var(--line)">
      <div class="act" style="color:var(--brand);font-weight:700" onclick="event.stopPropagation();toggleFav(${d.id});renderFav()">⭐ 收藏</div>
      <div class="act" onclick="event.stopPropagation();openDetail(${d.id})">查看</div>
    </div>
  </div>`;
}
function openFavDetail(ukey){
  const f = getFavByUkey(ukey); if(!f) return;
  const p = PLATFORM_META[f.platform];
  document.getElementById('sheetBody').innerHTML = `
    <div class="handle"></div><div class="close" onclick="closeSheet()">完成</div>
    <div class="detail">
      ${badgeHTML(f)}${catChipHTML(f)}
      <div class="plink" style="margin-top:8px">📌 ${p.label} · ${esc(f.author.name)} · 收藏于 ${fmtTime(f.savedAt)}${f.edited?' · ✍️ 已修改':''}</div>
      <div class="dtitle">${esc(f.title)}</div>
      <div class="copybox"><div class="ctitle">📝 好文全文</div>${esc(f.content)}</div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="copybtn" style="flex:2" onclick="copyFav('${f.ukey}')">📋 复制全文</button>
        <button class="copybtn" style="flex:1;background:linear-gradient(135deg,#6366f1,#8b5cf6)" onclick="openEditor('${f.ukey}')">✏️ 编辑</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="copybtn" style="flex:1;background:linear-gradient(135deg,#f43f5e,#fb7185)" onclick="delFav('${f.ukey}')">🗑 删除</button>
        <button class="copybtn" style="flex:1;background:#f1f2f5;color:var(--ink-2)" onclick="closeSheet()">返回</button>
      </div>
    </div>`;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetBody').scrollTop = 0;
}
function openEditor(ukey){
  const f = getFavByUkey(ukey); if(!f) return;
  document.getElementById('sheetBody').innerHTML = `
    <div class="handle"></div><div class="close" onclick="closeSheet()">完成</div>
    <div style="font-size:16px;font-weight:800;margin-bottom:12px">✏️ 编辑好文</div>
    <div class="edlabel">标题</div>
    <input class="edinput" id="edTitle" value="${esc(f.title)}" placeholder="请输入标题">
    <div class="edlabel">文案内容</div>
    <textarea class="edtextarea" id="edContent" placeholder="请输入完整文案">${esc(f.content)}</textarea>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="copybtn" style="flex:2" onclick="saveEdit('${f.ukey}')">💾 保存修改</button>
      <button class="copybtn" style="flex:1;background:#f1f2f5;color:var(--ink-2)" onclick="openFavDetail('${f.ukey}')">取消</button>
    </div>`;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetBody').scrollTop = 0;
  setTimeout(()=>{ const t=document.getElementById('edContent'); if(t){ t.focus(); const L=t.value.length; t.setSelectionRange(L,L); } }, 350);
}
function saveEdit(ukey){
  const f = getFavByUkey(ukey); if(!f) return;
  const t = document.getElementById('edTitle'), c = document.getElementById('edContent');
  if(!t || !c) return;
  if(!c.value.trim()){ toast('文案内容不能为空'); return; }
  f.title = t.value.trim() || f.title;
  f.content = c.value.trim();
  f.edited = true;
  saveState(); renderFav();
  openFavDetail(ukey);
  toast('✅ 好文已更新保存');
}
function delFav(ukey){
  const f = getFavByUkey(ukey); if(!f) return;
  if(!confirm('确定删除这篇收藏的好文吗？')) return;
  const i = state.favs.findIndex(x=>x.ukey===ukey);
  if(i>=0) state.favs.splice(i,1);
  saveState(); renderFav(); renderList(); renderMineStats();
  closeSheet(); toast('🗑 已删除');
}
function copyFav(ukey){
  const f = getFavByUkey(ukey); if(!f) return;
  const text = `【${PLATFORM_META[f.platform].label}好文】${f.title}\n\n${f.content}\n\n——来自 ${f.author.name}`;
  copyText(text, '✅ 好文已复制到剪贴板');
}
function exportFavs(){
  if(!state.favs.length){ toast('还没有收藏任何好文'); return; }
  const parts = state.favs.map((f,i)=>
    `【${i+1}】${f.title}\n（${PLATFORM_META[f.platform].label} · ${f.author.name} · 收藏于 ${fmtTime(f.savedAt)}${f.edited?' · 已修改':''}）\n\n${f.content}`
  );
  const blob = new Blob(['\ufeff'+parts.join('\n\n————————————\n\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的好文收藏_'+DAILY_META.date+'.txt';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 600);
  toast('📤 已导出 '+state.favs.length+' 篇好文');
}

/* ---------- 发现页 ---------- */
function tagCount(){
  const map = {};
  DEMO.forEach(d=>d.tags.forEach(t=>map[t]=(map[t]||0)+1));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function renderTopics(){
  const tops = tagCount().slice(0,8).map(([t,n],i)=>{
    const list = filterByTag(t);
    return `<div class="card" onclick="openTopic('${t}')">
      <div style="display:flex;align-items:center;gap:10px;padding:14px">
        <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#ff5a5f,#ff8a5c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700"># ${t}</div>
          <div style="font-size:11px;color:var(--ink-3);margin-top:3px">🔥 热度 ${n*10} · ${list.length} 条爆款文案</div>
        </div>
        <span style="font-size:12px;color:var(--ink-3)">›</span>
      </div>
      <div class="tags" style="padding:0 14px 12px;margin-top:-2px">
        ${list.slice(0,3).map(x=>`<span class="tag">${PLATFORM_META[x.platform].label}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
  document.getElementById('topics').innerHTML = tops;
}
function filterByTag(t){ return DEMO.filter(d=>d.tags.includes(t)); }
function openTopic(t){
  ui.kw = t; document.getElementById('kw').value = t;
  document.getElementById('kwClear').classList.add('show');
  switchPage('home'); renderList();
}
function renderRank(){
  const list = [...DEMO].sort((a,b)=>b.author.fans-a.author.fans);
  const seen = new Set();
  const top = list.filter(d=>{ if(seen.has(d.author.name)) return false; seen.add(d.author.name); return true; }).slice(0,6);
  document.getElementById('ranklist').innerHTML = top.map((d,i)=>`
    <div class="card" onclick="openBlogger(${d.id})">
      <div style="display:flex;align-items:center;gap:12px;padding:14px">
        <div style="width:24px;text-align:center;font-weight:800;font-size:17px;color:${i<3?'#ff5a5f':'#c3c9d4'}">${i+1}</div>
        <div class="avatar" style="background:${d.author.color}">${d.author.avatar}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700">${d.author.name}${d.author.verified?'<em class="v" style="color:#fff;background:var(--brand);font-size:9px;padding:1px 4px;border-radius:4px;margin-left:4px">大V</em>':''}</div>
          <div style="font-size:11px;color:var(--ink-3);margin-top:2px">${PLATFORM_META[d.platform].label} · ${d.author.bio.slice(0,20)}…</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:15px;font-weight:800;color:var(--brand)">${fmt(d.author.fans)}</div>
          <div style="font-size:10px;color:var(--ink-3)">粉丝</div>
        </div>
      </div>
      <div class="stats" style="border-top:1px solid var(--line)">
        <div class="stat">获赞 <b>${fmt(d.author.likes)}</b></div>
        <div class="stat">作品 <b>${fmt(d.author.works)}</b></div>
        <div class="stat">👤 <b>${state.follows.includes(d.author.name)?'已关注':'可关注'}</b></div>
      </div>
    </div>`).join('');
}

function renderMineStats(){
  document.getElementById('mFav').textContent = state.favs.length;
  document.getElementById('mLike').textContent = state.likes.length;
  document.getElementById('mHis').textContent = state.views.length;
  const u = document.getElementById('mineUpdate');
  if(u) u.textContent = '今日已更新 '+DAILY_META.count+' 条 · 已收藏 '+state.favs.length+' 篇好文 · 已关注 '+state.follows.length+' 位博主';
}
function clearData(){
  if(!state.views.length){ toast('暂无浏览记录'); return; }
  state.views=[]; saveState(); renderMineStats(); toast('🗑 浏览记录已清空');
}
function restoreDemo(){
  if(confirm('确定要清空本地数据，重新生成演示内容吗？')){
    state = {kv:{},favs:[],likes:[],views:[],follows:[]};
    DEMO = buildDaily();
    saveState(); renderAll(); toast('🔄 已恢复并重新生成今日内容');
  }
}

/* ---------- 页面/底部导航 ---------- */
function switchPage(name){
  ui.page = name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const names=['home','find','save','mine'];
    t.classList.toggle('active', names[i]===name);
  });
  window.scrollTo(0,0);
  if(name==='find'){ renderTopics(); renderRank(); }
  if(name==='save') renderFav();
  if(name==='mine') renderMineStats();
}

const TAB_BAR = `

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

}
loadState();
