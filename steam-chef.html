<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Steam Chef Simulator</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000;font-family:Arial,sans-serif}
canvas{display:block}
#blocker{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer}
#blocker.hidden{display:none}
#instructions{color:#fff;font-size:26px;text-align:center;background:rgba(0,0,0,0.5);padding:30px 50px;border-radius:12px;line-height:1.8}
#instructions small{font-size:15px;color:#aaa}
#message{position:fixed;top:8%;left:50%;transform:translateX(-50%);color:#fff;font-size:30px;font-weight:bold;text-shadow:2px 2px 4px rgba(0,0,0,0.8);z-index:5;pointer-events:none;transition:opacity .3s;opacity:0}
#message.show{opacity:1}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:26px;font-weight:bold;text-shadow:1px 1px 2px rgba(0,0,0,0.5);z-index:5;pointer-events:none}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.35);font-size:12px;z-index:5;pointer-events:none;text-align:center}
#total-earnings{position:fixed;top:18px;right:20px;color:#ffd700;font-size:22px;font-weight:bold;z-index:5;pointer-events:none;text-shadow:2px 2px 4px rgba(0,0,0,0.6)}
#order-paper{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(245,235,200,0.95);color:#333;padding:30px 40px;border-radius:16px;z-index:20;display:none;min-width:320px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.order-title{font-size:28px;font-weight:bold;margin-bottom:20px}
.order-content{font-size:20px;line-height:2.2;text-align:left}
.order-hint{font-size:16px;color:#888;margin-top:20px}
#result-screen{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:25}
#result-text{font-size:64px;font-weight:bold;color:#4caf50;text-shadow:2px 2px 8px rgba(0,0,0,0.5)}
#result-money{font-size:42px;color:#ffd700;margin-top:15px;text-shadow:2px 2px 4px rgba(0,0,0,0.5)}
#result-sub{font-size:18px;color:#aaa;margin-top:25px}
#talk-hint{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;z-index:15;display:none;text-shadow:1px 1px 3px rgba(0,0,0,0.8);pointer-events:none}
#dialogue-box{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:#fff;padding:22px 35px;z-index:35;display:none;min-height:170px;border-top:2px solid rgba(255,255,255,0.12)}
#dialogue-speaker{font-size:14px;color:#ffd700;margin-bottom:6px}
#dialogue-text{font-size:19px;line-height:1.6;min-height:55px}
#dialogue-text .cursor{animation:blink 0.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#dialogue-choices{display:none;gap:10px;margin-top:12px;flex-wrap:wrap}
#dialogue-choices button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 18px;border-radius:8px;font-size:15px;cursor:pointer;transition:.2s}
#dialogue-choices button:hover{background:rgba(255,215,0,0.2);border-color:#ffd700}
#story-card{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:36px}
#day-hud{position:fixed;top:6px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:13px;z-index:5;pointer-events:none;display:none}
#gameover-screen{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center}
#gameover-text{font-size:80px;font-weight:bold;color:#ff0000;text-shadow:0 0 30px rgba(255,0,0,0.8)}
#gameover-sub{font-size:28px;color:#ccc;margin-top:20px}
</style>
</head>
<body>
<div id="blocker"><div id="instructions">🍔 Steam Chef Simulator<br><small>点击或按空格进入游戏</small><br><br>WASD 移动 · 鼠标旋转 · 左键交互 · 右键丢弃</div></div>
<div id="talk-hint">【按X对话】</div>
<div id="dialogue-box"><div id="dialogue-speaker"></div><div id="dialogue-text"></div><div id="dialogue-choices"></div></div>
<div id="message"></div>
<div id="crosshair">+</div>
<div id="hint">WASD 行走 · 左键操作 · 右键丢食材 · 空格锁定鼠标</div>
<div id="total-earnings">💰 累计收入: 0元</div>
<div id="order-paper"><div class="order-title">📋 今日订单</div><div class="order-content" id="order-content"></div><div class="order-hint">按 T 切换显示</div></div>
<div id="result-screen"><div id="result-text"></div><div id="result-money"></div></div>
<div id="story-card"><div>这是我入职的第一天</div></div>
<div id="day-hud">第一天，店内仅有一位客人</div>
<div id="gameover-screen"><div id="gameover-text">Game Over</div><div id="gameover-sub">专心烹饪</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>
<script>
"use strict";


// === DIALOGUE SYSTEM ===
var chatting = false, chatStep = 0, chatCust = null, skipType = null, chatCallback = null;
var chatLines = ['今天天气真好，犒劳一下自己','刚下班饿死了，有什么推荐的？','听朋友说这家不错，推荐个招牌','第一次来，给推荐一个吧','今天想大吃一顿，你推荐啥？','随便做点啥都行，推荐就行','肚子好饿～推荐推荐','好久没吃了，推荐个好吃的','快点快点，你推荐啥我吃啥','要辣一点的，给我推荐个经典的','来份汉堡垫垫肚子','吃啥都行，看着安排吧','想尝尝你们这里的招牌菜','今天心情好，推荐个好的','有什么拿手好菜？推荐一下'];
var chatReplies = {
  '推荐招牌汉堡': ['好嘞！来份招牌的！','就这个吧，经典口味不会错'],
  '推荐双层牛肉汉堡': ['双层牛肉！今天就要过瘾！','太棒了，就要双层的！'],
  '推荐大份薯条': ['哈哈就想吃薯条！','光吃薯条不够，再加个汉堡吧']
};

function startDialogue(cust) {
  if (chatting) return;
  if (cust) { chatCust = cust; } else {
    chatCust = null;
    var anyNear = null; var activeNear = null; var undialoguedNear = null;
    for (var i = 0; i < G.customers.length; i++) {
      if (G.customers[i].served && G.phase !== 'resting') continue;
      var d = G.camera.position.distanceTo(new THREE.Vector3(G.customers[i].group.position.x, 0, G.customers[i].group.position.z));
      if (d >= 7.0) continue;
      anyNear = G.customers[i];
      if (G.activeCustomer && G.customers[i] === G.activeCustomer) { activeNear = G.customers[i]; }
      if (!G.customers[i].dialogued) { undialoguedNear = G.customers[i]; }
    }
    if (!anyNear) { msg('附近没有顾客'); return; }
    if (G.activeCustomer && activeNear && !activeNear.served) { chatCust = activeNear; }
    else if (anyNear.served) { chatCust = anyNear; }
    else if (undialoguedNear) { chatCust = undialoguedNear; }
    else { chatCust = anyNear; }
  }
  
  G.paused = true; chatting = true; chatStep = 0;
  document.getElementById('dialogue-box').style.display = 'block';
  document.getElementById('dialogue-speaker').textContent = '👤 顾客';
  document.getElementById('dialogue-choices').style.display = 'none';

  if (chatCust.served) {
    if (G.phase === 'resting') typewrite('有什么事吗？', function() { showChatChoices(); });
    else typewrite(chatBrief[Math.floor(Math.random()*chatBrief.length)], null);
  } else if (G.activeCustomer && !G.activeCustomer.served && chatCust === G.activeCustomer) {
    typewrite('你的订单还要多久啊？', function() { showBusyChoices(); });
  } else if (G.activeCustomer && !G.activeCustomer.served && chatCust.isOrdering && !chatCust.dialogued) {
    typewrite('什么时候到我？', function() { showBusyChoices(); });
  } else if (!chatCust.dialogued && chatCust.isOrdering) {
    if (Math.random() < 0.6) {
      // 60% chance: direct order
      typewrite('我想点这些，麻烦快一点哦！', null);
      chatCust._directOrder = true;
    } else {
      var txt = chatLines[Math.floor(Math.random() * chatLines.length)];
      typewrite(txt, function() { showChoices(); });
    }
  } else if (!chatCust.dialogued) {
    if (G.phase === 'resting') typewrite('有什么事吗？', function() { showChatChoices(); });
    else typewrite(chatBrief[Math.floor(Math.random()*chatBrief.length)], null);
  } else {
    typewrite('你有什么事吗？', function() { showBusyChoices(); });
  }
}

function showBusyChoices() {
  var container = document.getElementById('dialogue-choices');
  container.innerHTML = '';
  container.style.display = 'flex';
  var opts = G.activeCustomer && chatCust === G.activeCustomer ? ['马上就好', '再见'] : ['没有事', '再见'];
  opts.forEach(function(op, idx) {
    var btn = document.createElement('button');
    btn.textContent = (idx+1) + '. ' + op;
    btn.onclick = function() { selectBusy(op); };
    container.appendChild(btn);
  });
  document.addEventListener('keydown', onBusyKey);
}
function onBusyKey(e) {
  var opts = G.activeCustomer && chatCust === G.activeCustomer ? ['马上就好', '再见'] : ['没有事', '再见'];
  var idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < opts.length) { selectBusy(opts[idx]); document.removeEventListener('keydown', onBusyKey); }
}
function selectBusy(op) {
  document.getElementById('dialogue-choices').style.display = 'none';
  document.removeEventListener('keydown', onBusyKey);
  if (op === '再见') { closeDialogue(); return; }
  typewrite(op === '马上就好' || op === '马上' ? '好的，等你哦～' : '好的，那你先忙吧～', null);
}

function typewrite(text, callback) {
  var el = document.getElementById('dialogue-text');
  el.innerHTML = '';
  chatCallback = null;
  var i = 0;
  function step() {
    if (skipType) { el.innerHTML = text; skipType = null; done(); return; }
    if (i < text.length) { el.innerHTML = text.substring(0, i+1) + '<span class="cursor">|</span>'; i++; skipType = step; setTimeout(step, 40); }
    else { el.innerHTML = text; skipType = null; done(); }
  }
  function done() {
    if (callback) { el.innerHTML += '<br><small style="color:#888">按 R 继续</small>'; chatCallback = callback; }
    else { el.innerHTML += '<br><small style="color:#888">按 R 结束聊天</small>'; chatCallback = function(){closeDialogue();}; }
  }
  skipType = step;
  step();
}

var choiceList = ['推荐招牌汉堡', '推荐双层牛肉汉堡', '推荐大份薯条'];

function showChoices() {
  var container = document.getElementById('dialogue-choices');
  container.innerHTML = '';
  container.style.display = 'flex';
  choiceList.forEach(function(ch, idx) {
    var btn = document.createElement('button');
    btn.textContent = (idx+1) + '. ' + ch;
    btn.onclick = function() { selectChoice(ch); };
    container.appendChild(btn);
  });
  document.addEventListener('keydown', onDialogueKey);
}

function onDialogueKey(e) {
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    var idx = parseInt(e.key) - 1;
    selectChoice(choiceList[idx]);
    document.removeEventListener('keydown', onDialogueKey);
  }
}

function selectChoice(choice) {
  document.getElementById('dialogue-choices').style.display = 'none';
  document.removeEventListener('keydown', onDialogueKey);
  var replies = chatReplies[choice] || ['好的！'];
  var reply = replies[Math.floor(Math.random() * replies.length)];
  typewrite(reply, null);
}

var chatJokes = ['小白加小白等于什么？等于小白兔（小白two），好笑吧哈哈。','有一天火柴头浑身发痒，挠着挠着，自己把自己点着了。','海水为什么是蓝色的？因为小鱼一直在吐泡泡，布鲁布鲁（blue blue）。','从前有个人钓鱼，钓上来一只鱿鱼，鱿鱼苦苦哀求别烤了它，那人说行，考你几个问题就行，鱿鱼当场崩溃：别考别考！','你晓得布和纸最怕什么吗？不怕一万只怕万一，不（布）怕一万，只（纸）怕万一哟。','为什么大雁冬天要往南边飞？因为走过去太慢啦，当然要飞着走才行。','一颗玉米走在路上觉得太热，走着走着它就变成爆米花了。'];
var chatLores = ['我听说这家店收留过不少弄丢过往的人，在这里安安稳稳过日子，比在外颠沛流离舒服太多了。','看你处理食材的动作干脆利落，下手精准又沉稳，寻常打工的店员可练不出这种本事。','这家老店看着平平无奇，背地里藏着不少没人知晓的秘密，尤其是店铺往后的位置，可不简单。','偶尔深夜路过店铺后面，总能隐约听见细碎动静，总觉得那片墙后面藏着东西。'];
var chatBrief = ['我在等人呢。','这会儿忙，待会再说。','先看看菜单再说。','这里环境不错啊。','闻着好香～','今天人挺多的嘛。','坐会儿休息下。'];

function typewriteNPC(text, callback) {
  document.getElementById('dialogue-text').innerHTML = text.replace(/\\n/g,'<br>') + '<br><small style="color:#888">按 R 结束聊天</small>';
  chatCallback = callback || function(){closeDialogue();};
}

function eavesdrop(text) {
  G.paused = true; chatting = true;
  document.getElementById('dialogue-box').style.display = 'block';
  document.getElementById('dialogue-speaker').textContent = '👤 偷听中...';
  typewriteNPC(text, null);
}

function showEvesNext() {
  document.getElementById('dialogue-speaker').textContent = '👤 偷听中...';
  typewrite(G.evesLines[G.evesIdx], function(){ G.evesIdx++; if(G.evesIdx<G.evesLines.length) showEvesNext(); else {G.evesLines=[];G.evesIdx=0;closeDialogue();} });
}

function showChatChoices() {
  var container = document.getElementById('dialogue-choices');
  container.innerHTML = '';
  container.style.display = 'flex';
  var opts = ['没\u4e8b','想和你闲聊一会'];
  opts.forEach(function(op, idx) {
    var btn = document.createElement('button');
    btn.textContent = (idx+1) + '. ' + op;
    btn.onclick = function() { selectChat(op); };
    container.appendChild(btn);
  });
  document.addEventListener('keydown', onChatKey);
}
function onChatKey(e) {
  var opts = ['没\u4e8b','想和你闲聊一会'];
  var idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < opts.length) { selectChat(opts[idx]); document.removeEventListener('keydown', onChatKey); }
}
function selectChat(op) {
  document.getElementById('dialogue-choices').style.display = 'none';
  document.removeEventListener('keydown', onChatKey);
  if (op.indexOf('没事')>=0) { closeDialogue(); return; }
  var r = Math.random();
  if (r < 0.5) { typewrite('不了，我还有事。', null); }
  else if (r < 0.8) { typewrite(chatJokes[Math.floor(Math.random()*chatJokes.length)], null); }
  else { typewrite(chatLores[Math.floor(Math.random()*chatLores.length)], null); }
}

function endRestTime() {
  G.restActive = false; G.restTimer = 0; G.day++;
  document.getElementById('story-card').innerHTML = '<div style="font-size:50px">第' + G.day + '天</div>';
  document.getElementById('story-card').style.display = 'flex';
  setTimeout(function(){
    document.getElementById('story-card').style.display='none';
    document.getElementById('story-card').innerHTML = '<div>这是我入职的第一天</div>';
    G.phase = 'waiting';
    G.camera.position.set(0, 1.7, 4.5); G.yaw = 0; G.pitch = 0;
    G.ass.bBot=0;G.ass.stk=0;G.ass.eg=0;G.ass.lt=0;G.ass.bTop=0;G.ass.sc=[];
    if(G.ass.vis){G.scene.remove(G.ass.vis);G.ass.vis=null;}
    if(G.tray.mesh){G.scene.remove(G.tray.mesh);G.tray.mesh=null;G.tray.placed=false;}
    G.tray.slots.forEach(function(s,i){if(s){G.scene.remove(s);G.tray.slots[i]=null;}});
    G.gSlots.forEach(function(s){if(s.m){G.scene.remove(s.m);s.m=0;s.o=0;s.s='e';s.ti=0;s.r=0;}});
    G.fSlots.forEach(function(s){if(s.m){G.scene.remove(s.m);s.m=0;s.o=0;s.s='e';s.ti=0;s.r=0;}});
    spawnCustomers();
    G.activeCustomer = null;
    document.getElementById('day-hud').textContent = '第一天，店内仅有一位客人';
  }, 2500);
}

function closeDialogue() {
  document.getElementById('dialogue-box').style.display = 'none';
  G.paused = false;
  chatting = false;
  chatCallback = null;
  skipType = null;
  if (chatCust && !chatCust.dialogued && chatCust.isOrdering) {
    // Only set as active if no other active customer
    if (!G.activeCustomer || G.activeCustomer.served) {
      chatCust.dialogued = true;
      G.activeCustomer = chatCust;
      G.order = chatCust.order;
      G.phase = 'playing';
      showPaper(chatCust.order);
      msg('📋 接到订单！按 T 查看', 3000);
    }
  }
}



// ===== GLOBALS =====
var G = {
  init: false, phase: 'ordering',
  scene: null, camera: null, renderer: null,
  locked: false, carried: null,
  yaw: 0, pitch: 0, speed: 4.5,
  order: null, waiter: null, money: 0,
  customers: [],
  ass: { bBot:0, stk:0, eg:0, lt:0, bTop:0, sc:[], vis:null },
  boxes: [], zones: [], loose: [], drops: [],
  tray: { placed:false, mesh:null, slots:[null,null,null,null,null,null] },
  gSlots: [], fSlots: [],
  prepIdx: 0,
  bOpen: false, dOpen: false,
  comboOnDesk: null,
  paused: false, dialogueTarget: null,
  activeCustomer: null,
  day: 1,
  restTimer: 0,
  restActive: false,
  restInfinite: false,
  eavesdropped: false,
  evesLines: [], evesIdx: 0,
  npcA: null, npcB: null,
  doorPiv: null, divPiv: null,
  keys: {}, clock: null
};
var slotPos = [[-0.7,0.53,-0.9],[0.7,0.53,-0.9],[-0.7,0.53,0],[0.7,0.53,0],[-0.7,0.53,0.9],[0.7,0.53,0.9]];
var msgEl = document.getElementById('message'), msgTimer = null;

function msg(text, dur) {
  if (!dur) dur = 2000;
  msgEl.textContent = text;
  msgEl.classList.add('show');
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(function() { msgEl.classList.remove('show'); }, dur);
}

function coll(minX, maxX, minZ, maxZ, key) {
  G.boxes.push({ minX: minX, maxX: maxX, minZ: minZ, maxZ: maxZ, key: key || null });
}

function collRemove(key) {
  for (var i = G.boxes.length - 1; i >= 0; i--) {
    if (G.boxes[i].key === key) G.boxes.splice(i, 1);
  }
}

function canMove(x, z, r) {
  for (var i = 0; i < G.boxes.length; i++) {
    var b = G.boxes[i];
    if (b.key && window[b.key] === false) continue;
    if (x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ) return false;
  }
  return true;
}

function mkZone(parent, w, h, d, oy) {
   var z = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }));
  z.position.y = oy;
  z.userData.isInteractable = true;
  parent.add(z);
  G.zones.push(z);
  return z;
}

function mkCount(parent, w, d, c) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), new THREE.MeshStandardMaterial({ color: c || 0x888888, roughness: 0.7 }));
  m.position.y = 0.25;
  m.castShadow = true;
  parent.add(m);
  return m;
}

function pickUp(m) {
  if (G.carried) { msg('先丢掉手里的东西'); return false; }
  G.carried = m;
  m.userData.canPickup = 0;
  var idx = G.loose.indexOf(m);
  if (idx >= 0) G.loose.splice(idx, 1);
  var names = { steak: '生牛排', fries: '薯条', egg: '鸡蛋', lettuce: '生菜', bun: '面包', ketchup: '番茄酱', mustard: '芥末酱', cola: '可乐', sprite: '雪碧', burger: '汉堡', tray: '托盘', combo: '套餐' };
  msg('拿起' + (names[m.userData.type] || '食材'));
  return true;
}

function dropIt() {
  if (!G.carried) return;
  var dir = new THREE.Vector3(0, 0, -1).applyQuaternion(G.camera.quaternion);
  var pos = G.camera.position.clone().add(dir.clone().multiplyScalar(1.2));
  pos.y = Math.max(0.1, pos.y);
  for (var i = 0; i < G.boxes.length; i++) {
    var bx = G.boxes[i];
    if (bx.key && window[bx.key] === false) continue;

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(G.clock.getDelta(), 0.05);

  if (G.locked) {
    var fwd = new THREE.Vector3(-Math.sin(G.yaw), 0, -Math.cos(G.yaw));
    var right = new THREE.Vector3(fwd.z, 0, -fwd.x);
    var mv = new THREE.Vector3();
    if (G.keys['w']) mv.add(fwd);
    if (G.keys['s']) mv.sub(fwd);
    if (G.keys['a']) mv.add(right);
    if (G.keys['d']) mv.sub(right);
    if (mv.length() > 0) mv.normalize().multiplyScalar(G.speed * dt);
    var nx = G.camera.position.x + mv.x, nz = G.camera.position.z + mv.z;
    if (canMove(nx, G.camera.position.z, 0.25)) G.camera.position.x = nx;
    if (canMove(G.camera.position.x, nz, 0.25)) G.camera.position.z = nz;
    var zMin = -30;
    G.camera.position.x = Math.max(-12, Math.min(12, G.camera.position.x));
    G.camera.position.z = Math.max(zMin, Math.min(4.8, G.camera.position.z));
    G.camera.position.y = 1.7;
    // Pit: player falls through removed floor (x=8.1~12.1, z=-6.1~6.1)
    if (G.camera.position.x > 8.0 && G.camera.position.x < 12.2 && G.camera.position.z > -6.15 && G.camera.position.z < 6.15) G.camera.position.y = -10;
    G.camera.position.y = 1.7;
  }

  G.camera.quaternion.setFromEuler(new THREE.Euler(G.pitch, G.yaw, 0, 'YXZ'));

  if (G.paused) { G.renderer.render(G.scene, G.camera); return; }

  // Carried item
  if (G.carried) {
    var isCombo = G.carried.userData.type === 'combo';
    var off = new THREE.Vector3(isCombo ? -0.3 : 0.5, isCombo ? -0.15 : -0.35, isCombo ? -1.6 : -0.85).applyQuaternion(G.camera.quaternion);
    G.carried.position.copy(G.camera.position).add(off);
    G.carried.quaternion.copy(G.camera.quaternion);
    var sc = isCombo ? 2.0 : (G.carried.userData.type === 'burger' ? 2 : 2.5);
    G.carried.scale.set(sc, sc, sc);
    G.carried.position.y -= 0.05;
  }

  // Grill cooking
  G.gSlots.forEach(function(s) {
    if (s.s !== 'cooking') return;
    s.ti += dt;
    var ct = s.t === 'steak' ? 8 : 4, bt = s.t === 'steak' ? 14 : 7;
    if (s.ti >= bt) { if (s.m) { G.scene.remove(s.m); s.m = 0; } s.o = 0; s.s = 'e'; s.t = 0; s.ti = 0; s.r = 0; msg('煎糊了！已丢弃'); }
    else if (s.ti >= ct && !s.r) { s.s = 'ready'; s.r = 1; if (s.m) { if (s.m.isMesh) s.m.material = s.t === 'steak' ? new THREE.MeshStandardMaterial({ color: 0x6b3a1f, roughness: 0.8 }) : new THREE.MeshStandardMaterial({ color: 0xfff8dc, roughness: 0.5 }); if (s.m.userData) s.m.userData.state = 'cooked'; } msg(s.t === 'steak' ? '牛排煎好了' : '鸡蛋煎好了'); }
  });

  // Fryer cooking
  G.fSlots.forEach(function(s) {
    if (s.s !== 'cooking') return;
    s.ti += dt;
    if (s.ti >= 11) { if (s.m) { G.scene.remove(s.m); s.m = 0; } s.o = 0; s.s = 'e'; s.ti = 0; s.r = 0; msg('炸糊了！已丢弃'); }
    else if (s.ti >= 6 && !s.r) { s.s = 'ready'; s.r = 1; if (s.m && s.m.userData) s.m.userData.state = 'cooked'; if (s.m && s.m.type === 'Group') s.m.children.forEach(function(c) { if (c.isMesh) c.material = new THREE.MeshStandardMaterial({ color: 0xd4942b, roughness: 0.6 }); }); msg('薯条炸好了'); }
  });

  // Rest timer countdown
  if (G.restActive && G.restTimer > 0 && !G.restInfinite) {
    G.restTimer -= dt;
    var mins = Math.floor(G.restTimer / 60);
    var secs = Math.floor(G.restTimer % 60);
    document.getElementById('day-hud').textContent = '休息时间: ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
    if (G.restTimer <= 0) { endRestTime(); }
  }

  // Eavesdrop hint (kitchen side near NPCs) - highest priority
  if (G.npcA && G.npcB && G.camera.position.x>1&&G.camera.position.x<8 && G.camera.position.z>-6&&G.camera.position.z<-4) {
    document.getElementById('talk-hint').style.display = 'block';
    document.getElementById('talk-hint').textContent = '【按 Z 偷听】';
  }
  // X key proximity hint (crosshair-based)
  if (!G.paused && (G.phase === 'waiting' || G.phase === 'playing' || G.phase === 'resting')) {
    var hitsCrosshair = false;
    var ray2 = new THREE.Raycaster(); var ptr2 = new THREE.Vector2(0,0);
    ray2.setFromCamera(ptr2, G.camera);
    for (var ci=0; ci<G.customers.length; ci++) {
      if (!G.customers[ci].served && G.customers[ci].group) {
        var customerHits = ray2.intersectObjects(G.customers[ci].group.children, true);
        if (customerHits.length > 0) { hitsCrosshair = true; break; }
      }
    }
    document.getElementById('talk-hint').style.display = hitsCrosshair ? 'block' : 'none';
  }
  // Customer walk to destination
  if (!G.paused && G.customers.length > 0) {
    for (var ci=0; ci<G.customers.length; ci++) {
      var c = G.customers[ci];
      if (!c.served && c.group && !c.arrived) {
        var dx = c.destX - c.group.position.x;
        var dz = c.destZ - c.group.position.z;
        var dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < 0.3) {
          c.group.position.set(c.destX, 0, c.destZ); c.arrived = true;
          if (!c.exclam && c.isOrdering) {
            var excCanvas=document.createElement('canvas');excCanvas.width=128;excCanvas.height=128;
            var excCtx=excCanvas.getContext('2d');excCtx.fillStyle='#ff0000';excCtx.font='bold 100px Arial';excCtx.textAlign='center';excCtx.fillText('!',64,100);
            var excTex=new THREE.CanvasTexture(excCanvas);
            var excSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:excTex,transparent:true,depthTest:false,depthWrite:false}));
            excSprite.position.set(c.group.position.x,3.0,c.group.position.z);excSprite.scale.set(1.0,1.0,1);c.exclam=excSprite;G.scene.add(excSprite);
          }
        } else { var spd=1.5*dt; c.group.position.x+=(dx/dist)*spd; c.group.position.z+=(dz/dist)*spd; }
      }
    }
  }
  
  // Drop physics
  for (var i = G.drops.length - 1; i >= 0; i--) {
    var d = G.drops[i];
    d.v.y -= 0.05;
    var nx2 = d.m.position.x + d.v.x * 0.02, nz2 = d.m.position.z + d.v.z * 0.02;
    var blocked = false;
    for (var j = 0; j < G.boxes.length; j++) {
      var bx = G.boxes[j];
      if (bx.key && window[bx.key] === false) continue;
      if (nx2 + 0.15 > bx.minX && nx2 - 0.15 < bx.maxX && nz2 + 0.15 > bx.minZ && nz2 - 0.15 < bx.maxZ) { blocked = true; break; }
    }
    if (blocked) { d.v.x = 0; d.v.z = 0; } else { d.m.position.x = nx2; d.m.position.z = nz2; }
    d.m.position.y += d.v.y * 0.02;
    d.l--;
    if (d.m.position.y < 0.05 || d.l <= -60) { d.m.position.y = 0.05; d.v.x = 0; d.v.z = 0; if (d.l <= -90) G.drops.splice(i, 1); }
  }

  G.renderer.render(G.scene, G.camera);
}

// ===== GAME FUNCTIONS =====
function getStation() {
  var ray = new THREE.Raycaster();
  var ptr = new THREE.Vector2(0, 0);
  ray.setFromCamera(ptr, G.camera);
  var hits = ray.intersectObjects(G.zones);
  if (hits.length > 0) {
    var o = hits[0].object;
    while (o) { if (o.userData.isInteractable) return o.parent; o = o.parent; }
  }
  return null;
}

function getLoose() {
  if (G.loose.length === 0) return null;
  var ray = new THREE.Raycaster();
  var ptr = new THREE.Vector2(0, 0);
  ray.setFromCamera(ptr, G.camera);
  var hits = ray.intersectObjects(G.loose, true);
  if (hits.length > 0) {
    var o = hits[0].object;
    while (o) { if (o.userData.canPickup) return o; o = o.parent; }
  }
  return null;
}

// Station handlers
function handleGrill() {
  if (G.carried && (G.carried.userData.type === 'steak' || G.carried.userData.type === 'egg') && G.carried.userData.state === 'raw') {
    placeOnGrill(G.carried, G.carried.userData.type);
    return;
  }
  if (!G.carried) {
    var r = G.gSlots.find(function(s) { return s.s === 'ready'; });
    if (r) { var m = r.m; r.o = 0; r.m = 0; r.t = 0; r.ti = 0; r.s = 'e'; r.r = 0; pickUp(m); return; }
    var b = G.gSlots.filter(function(s) { return s.o; });
    if (!b.length) msg('从柜子拿食材来煎');
    else msg('正在煎...');
    return;
  }

    G.tray.slots[i] = null;
  });

  G.tray.placed = false;

function disassembleComboFromHand() {
  if (!G.carried || G.carried.userData.type !== 'combo') return;
  var combo = G.carried; G.carried = null;
  combo.scale.set(1, 1, 1);
  // Create tray on packing station
  var tray = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.025, 0.55), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 }));
  tray.scale.set(4, 1, 4.2); tray.position.set(5.5, 0.5125, -0.5);
  G.scene.add(tray); G.tray.mesh = tray; G.tray.placed = true;
  // Extract items from combo group back to tray
  var ci = 0;
  var toRemove = [];
  while (combo.children.length > 0 && ci < 6) {
    var child = combo.children[0];
    combo.remove(child);
    toRemove.push(child);
    ci++;
  }
  // Remove tray from combo group (it was added as a child)
  var trayInCombo = toRemove.pop(); // last added = tray mesh
  // Place remaining items on tray slots
  var si = 0;
  toRemove.forEach(function(it) {
    G.tray.slots[si] = it;
    it.position.set(5.5 + slotPos[si][0], slotPos[si][1], -0.5 + slotPos[si][2]);
    it.userData.canPickup = 0;
    G.scene.add(it);
    si++;
  });
  G.scene.remove(combo);
  collRemove('comboSolid');
  msg('套餐已拆解');
}

      var allServed = true;
      for (var si=0; si<G.customers.length; si++) {
        if (G.customers[si].isOrdering && !G.customers[si].served) { allServed = false; break; }
      }
      if (allServed) {
        if (G.day >= 2) {
          G.phase = 'resting'; G.restActive = true;
          if (G.day >= 3) { G.restInfinite = true; G.restTimer = 99999; }
          else { G.restTimer = 180; G.restInfinite = false; }
          document.getElementById('day-hud').style.display = 'block';
          document.getElementById('day-hud').textContent = G.restInfinite ? '休息时间' : '休息时间: 3:00';
          if (G.day >= 3) {
            setTimeout(function() {
              document.getElementById('story-card').innerHTML = '<div style="font-size:50px">厨房门口有两个人很可疑，去打听一下</div>';
              document.getElementById('story-card').style.display = 'flex';
              setTimeout(function(){ document.getElementById('story-card').style.display='none'; document.getElementById('story-card').innerHTML='<div>这是我入职的第一天</div>'; }, 4000);
            }, 2000);
          }
          msg('休息时间开始，可以自由闲聊', 3000);
        } else {
          G.day++;
          document.getElementById('story-card').innerHTML = '<div style="font-size:50px">第' + G.day + '天</div>';
          document.getElementById('story-card').style.display = 'flex';
          setTimeout(function(){
            document.getElementById('story-card').style.display='none';
            document.getElementById('story-card').innerHTML = '<div>这是我入职的第一天</div>';
            G.phase = 'waiting';
            G.camera.position.set(0, 1.7, 4.5); G.yaw = 0; G.pitch = 0;
            G.ass.bBot=0;G.ass.stk=0;G.ass.eg=0;G.ass.lt=0;G.ass.bTop=0;G.ass.sc=[];
            if(G.ass.vis){G.scene.remove(G.ass.vis);G.ass.vis=null;}
            if(G.tray.mesh){G.scene.remove(G.tray.mesh);G.tray.mesh=null;G.tray.placed=false;}
            G.tray.slots.forEach(function(s,i){if(s){G.scene.remove(s);G.tray.slots[i]=null;}});
            G.gSlots.forEach(function(s){if(s.m){G.scene.remove(s.m);s.m=0;s.o=0;s.s='e';s.ti=0;s.r=0;}});
            G.fSlots.forEach(function(s){if(s.m){G.scene.remove(s.m);s.m=0;s.o=0;s.s='e';s.ti=0;s.r=0;}});
            spawnCustomers();
            G.activeCustomer = null;
          }, 2500);
        }
      } else {
        G.phase = 'playing';
        msg('还有顾客需要服务', 2000);
      }
    }, 4500);
  }, 2000);
}

function toggleDivDoor() {
  if (!G.dOpen) {
    G.dOpen = true;
    collRemove('divDoorSolid');
    coll(-10.15, -10.05, -0.7, 1.1, 'divDoorSolid'); // rotated 90° along Z
    var st = performance.now();
    !function d1(){ var t = Math.min((performance.now()-st)/500, 1); G.divPiv.rotation.y = Math.PI/2*t; if(t<1) requestAnimationFrame(d1); }();
  } else {
    G.dOpen = false;
    collRemove('divDoorSolid');
    coll(-10.08, -8.28, 0.95, 1.25, 'divDoorSolid'); // back to doorway position
    var st2 = performance.now();
    !function d2(){ var t2 = Math.min((performance.now()-st2)/500, 1); G.divPiv.rotation.y = Math.PI/2*(1-t2); if(t2<1) requestAnimationFrame(d2); }();
  }
}

// ===== CUSTOMER SYSTEM =====
var custTexts = ['今天天气真好啊', '刚下班，饿死了', '听朋友说这家不错', '来个汉堡垫垫肚子',
  '今天想大吃一顿', '随便做点啥都行', '肚子好饿啊～', '好久没吃汉堡了', '有什么推荐的吗',
  '今天心情好，犒劳自己', '快点快点饿死了', '少放点生菜哈', '要辣一点的！'];
var custColors = [0xff6b6b, 0x6bc5ff, 0xffd93d, 0xa8e6cf, 0xdda0dd, 0xff9f43, 0x6dd5ed, 0xffcccc];

function makeNPC(cx, cz, rotY, color) {
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.5, 8), new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 }));
  body.position.y = 0.75; g.add(body);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshStandardMaterial({ color: 0xf5cba7, roughness: 0.7 }));
  head.position.y = 1.1; g.add(head);
  var lL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.06), new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 })); lL.position.set(-0.08, 0.2, 0); g.add(lL);
  var lR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.06), new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 })); lR.position.set(0.08, 0.2, 0); g.add(lR);
  g.position.set(cx, 0, cz); g.rotation.y = rotY;
  g.scale.set(1, 1.55 + Math.random() * 0.25, 1);
  G.scene.add(g);
  // Yellow question mark above NPC
  var qCanvas = document.createElement('canvas'); qCanvas.width=128; qCanvas.height=128;
  var qCtx = qCanvas.getContext('2d'); qCtx.fillStyle='#ffdd00'; qCtx.font='bold 100px Arial'; qCtx.textAlign='center'; qCtx.fillText('?',64,100);
  var qTex = new THREE.CanvasTexture(qCanvas);
  var qSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:qTex,transparent:true,depthTest:false,depthWrite:false}));
  qSprite.position.set(cx, 3.0, cz); qSprite.scale.set(1.0,1.0,1); G.scene.add(qSprite);
  var zone = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.5, 0.6), new THREE.MeshBasicMaterial({ visible: false }));
  zone.position.y = 0.75; zone.userData = { isInteractable: true, isNPC: true }; g.add(zone); G.zones.push(zone);
  return g;
}

function spawnCustomers() {
  G.customers.forEach(function(c) { if (c.group) { G.scene.remove(c.group); c.group = null; } });
  G.customers = [];
  var orderCount = G.day === 1 ? 1 : 2;
  var totalCount = 6;
  var shuffledColors = custColors.slice().sort(function(){return Math.random()-0.5;});
  var xPositions = [-10, -6, -2, 2, 6, 10];
  var xBase = [-10, -6, -2, 2, 6, 10];
  for (var ci = 0; ci < totalCount; ci++) {
    var isOrdering = ci < orderCount;
    var cx = isOrdering ? xBase[ci] + 10 : xBase[ci];
    var cz = -15 - (ci % 3) * 4;
    var g = new THREE.Group();
    var hc = shuffledColors[ci % shuffledColors.length];
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.5, 8), new THREE.MeshStandardMaterial({ color: hc, roughness: 0.7 }));
    body.position.y = 0.75; g.add(body);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshStandardMaterial({ color: 0xf5cba7, roughness: 0.7 }));
    head.position.y = 1.1; g.add(head);
    var legL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.06), new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 }));
    legL.position.set(-0.08, 0.2, 0); g.add(legL);
    var legR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.06), new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 }));
    legR.position.set(0.08, 0.2, 0); g.add(legR);
    g.position.set(cx, 0, cz);
    var hScale = 1.55 + Math.random() * 0.25;
    g.scale.set(1, hScale, 1);
    G.scene.add(g);

    var order = { burger: null, fries: 0, drinks: [] };
    if (Math.random() > 0.25) {
      var ing = ['steak', 'egg', 'lettuce', 'ketchup', 'mustard'];
      var cnt = 3 + Math.floor(Math.random() * 2);
      var its = []; var sauceCount=0;
      for (var gi = 0; gi < cnt; gi++) {
        var picked=ing[Math.floor(Math.random()*ing.length)];
        if(picked==='ketchup'||picked==='mustard'){sauceCount++;if(sauceCount>2){picked=ing[Math.floor(Math.random()*3)];}} // max 2 sauces
        its.push(picked);
      }
      order.burger = its;
    }
    order.fries = Math.floor(Math.random() * 3);
    var dc2 = Math.floor(Math.random() * 3);
    for (var di = 0; di < dc2; di++) order.drinks.push(Math.random() > 0.5 ? 'cola' : 'sprite');
    if (!order.burger && !order.fries && !dc2) { order.fries = 1 + Math.floor(Math.random() * 2); order.drinks.push('cola'); }
    var tot = (order.burger ? 1 : 0) + order.fries + order.drinks.length;
    while (tot > 6 && order.drinks.length) { order.drinks.pop(); tot--; }
    while (tot > 6 && order.fries) { order.fries--; tot--; }

    var cust = { group: g, order: order, served: false, dialogued: false, x: cx, talked: false,
      destX: cx, destZ: isOrdering ? -10.5 : cz,
      arrived: false, exclam: null, isOrdering: isOrdering };
    var zone = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.5, 0.6), new THREE.MeshBasicMaterial({ visible: false }));
    zone.position.y = 0.75;
    zone.userData = { isInteractable: true, isCustomer: true, custIdx: ci };
    g.add(zone);
    G.zones.push(zone);
    G.customers.push(cust);
    coll(cx-0.4, cx+0.4, cz-0.4, cz+0.4, 'cust'+ci);
  }
  // Day 3+ NPC pair behind back wall
  if (G.day >= 3 && !G.npcA) {
    G.npcA = makeNPC(4, -6.8, 0, 0x8888ff); // blue, face +Z
    G.npcB = makeNPC(4, -7.8, Math.PI, 0xff8888); // red, face -Z
  }
  msg('走到前台跟顾客对话接单', 3000);
}
function showPaper(order) {
  var el = document.getElementById('order-paper');
  var ct = document.getElementById('order-content');
  var h = '';
  if (order.burger) {
    var ns = { steak: '牛排', egg: '煎蛋', lettuce: '生菜', ketchup: '番茄酱', mustard: '芥末酱' };
    h += '🍔 汉堡: ' + order.burger.map(function(i) { return ns[i]; }).join('+') + '<br>';
  }
  if (order.fries) h += '🍟 薯条: ' + order.fries + '份<br>';
  if (order.drinks.length) {
    var dn = { cola: '可乐', sprite: '雪碧' };
    var cc = {};
    order.drinks.forEach(function(d) { cc[d] = (cc[d] || 0) + 1; });
    h += '🥤 饮料: ' + Object.keys(cc).map(function(k) { return dn[k] + '×' + cc[k]; }).join(' ');
  }
  ct.innerHTML = h;
  el.style.display = 'block';
}

function hidePaper() { document.getElementById('order-paper').style.display = 'none'; }

function showResult(success, amount) {
  if (success) { G.money += amount; document.getElementById('total-earnings').textContent = '💰 累计收入: ' + G.money + '元'; }
  document.getElementById('result-text').textContent = success ? '✅ 成功！' : '❌ 订单不符';
  document.getElementById('result-money').textContent = success ? '收入: ' + amount + '元' : '请重新制作';
  document.getElementById('result-screen').style.display = 'flex';
}

function hideResult() { document.getElementById('result-screen').style.display = 'none'; }

function newRound() {
  hideResult();
  hidePaper();
  G.phase = 'waiting';
  G.ass.bBot = 0; G.ass.stk = 0; G.ass.eg = 0; G.ass.lt = 0; G.ass.bTop = 0; G.ass.sc = [];
  G.activeCustomer = null;
  if (G.ass.vis) { G.scene.remove(G.ass.vis); G.ass.vis = null; }
  if (G.comboOnDesk) { G.scene.remove(G.comboOnDesk); G.comboOnDesk = null; collRemove('comboSolid'); }
  if (G.tray.mesh) { G.scene.remove(G.tray.mesh); G.tray.mesh = null; G.tray.placed = false; }
  G.tray.slots.forEach(function(s, i) { if (s) { G.scene.remove(s); G.tray.slots[i] = null; } });
  G.gSlots.forEach(function(s) { if (s.m) { G.scene.remove(s.m); s.m = 0; s.o = 0; s.s = 'e'; s.ti = 0; s.r = 0; } });
  G.fSlots.forEach(function(s) { if (s.m) { G.scene.remove(s.m); s.m = 0; s.o = 0; s.s = 'e'; s.ti = 0; s.r = 0; } });
  spawnCustomers();
}

function calcPrice(order) {
  var p = 0;
  if (order.burger) p += 10 + order.burger.length * 10;
  p += order.fries * 10;
  p += order.drinks.length * 5;
  return p;
}

function checkOrder(order, burgerRecipe, trayItems) {
  var ok = true;
  if (order.burger) {
    var ca = {}, cb = {};
    order.burger.forEach(function(x) { ca[x] = (ca[x] || 0) + 1; });
    if (burgerRecipe) burgerRecipe.forEach(function(x) { cb[x] = (cb[x] || 0) + 1; });
    if (!burgerRecipe || burgerRecipe.length !== order.burger.length ||
      !Object.keys(ca).every(function(k) { return ca[k] === cb[k]; }) ||
      !Object.keys(cb).every(function(k) { return ca[k] === cb[k]; })) ok = false;
  } else if (burgerRecipe) ok = false;
  var friesCount = trayItems.filter(function(i) { return i === 'fries'; }).length;
  if (friesCount !== order.fries) ok = false;
  var drinksOnTray = trayItems.filter(function(i) { return i === 'cola' || i === 'sprite'; });
  if (drinksOnTray.length !== order.drinks.length) ok = false;
  if (ok) {
    var dc = {}, dc2 = {};
    order.drinks.forEach(function(d) { dc[d] = (dc[d] || 0) + 1; });
    drinksOnTray.forEach(function(d) { dc2[d] = (dc2[d] || 0) + 1; });
    if (Object.keys(dc).some(function(k) { return dc[k] !== dc2[k]; })) ok = false;
  }
  return ok;
}

function deliverTo(cust) {
  if (G.phase !== 'playing') return;
  if (!G.tray.placed) { msg('先放托盘和食品'); return; }

  var items = [], burgerRecipe = null;
  G.tray.slots.forEach(function(s) {
    if (!s) return;
    if (s.userData.type === 'burger') { items.push('burger'); burgerRecipe = s.userData.recipe || []; }
    else if (s.userData.type === 'fries') items.push('fries');
    else if (s.userData.type === 'cola' || s.userData.type === 'sprite') items.push(s.userData.type);
  });

  if (!checkOrder(cust.order, burgerRecipe, items)) {
    msg('订单不符，请重新制作');
    return;
  }

  cust.served = true;
  hidePaper();
  G.phase = 'delivering';

  // Waiter takes tray
  var w = createWaiter();
  w.position.set(cust.x, 0, -6.5);
  G.scene.add(w);
  G.waiter = w;

  if (G.tray.mesh) { G.scene.remove(G.tray.mesh); G.tray.mesh = null; }
  G.tray.slots.forEach(function(s, i) { if (s) { G.scene.remove(s); G.tray.slots[i] = null; } });
  G.tray.placed = false;

  var price = calcPrice(cust.order);
  showResult(true, price);
  G.phase = 'success';

  setTimeout(function() { G.scene.remove(w); G.waiter = null; }, 1500);
  setTimeout(function() {
    G.scene.remove(cust.group);
    cust.group = null;
    spawnCustomers();
    G.phase = 'waiting';
    hideResult();
    msg('新顾客来了', 3000);
  }, 4500);
}

function createWaiter() {
  var g = new THREE.Group();
  var bd = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  bd.position.y = 0.75; g.add(bd);
  var hd = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshStandardMaterial({ color: 0xf5cba7 }));
  hd.position.y = 1.1; g.add(hd);
  var aL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  aL.position.set(-0.25, 0.85, 0); g.add(aL);
  var aR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  aR.position.set(0.25, 0.85, 0); g.add(aR);
  var lL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.3, 0.06), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  lL.position.set(-0.1, 0.25, 0); g.add(lL);
  var lR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.3, 0.06), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  lR.position.set(0.1, 0.25, 0); g.add(lR);
  return g;
}
