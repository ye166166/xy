[platformio]
default_envs = esp32-s3

; ============================================================
; Mesh应急通讯控制台
; 目标硬件: M5Stack Cardputer-Adv (ESP32-S3) + Cap LoRa-1262 (SX1262 + ATGM336H GNSS)
;
; 引脚速查 (Cardputer-Adv EXT 14P 总线):
;   LoRa:  NSS=G5  IRQ=G4  RST=G3  BUSY=G6
;   SPI :  SCK=G40  MOSI=G14  MISO=G39   (与 SD 卡共用总线)
;   SD  :  CS=G12
;   GPS :  Serial1  RX=G15  TX=G13  @115200
;   RF  :  PI4IOE5V6408 IO扩展 @0x43 (M5Unified 内置驱动), P0=天线开关
; ============================================================

[env:esp32-s3]
platform = espressif32@^6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    jgromes/RadioLib@^7.0.0
